<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAP TANAH — Sistem Informasi Arsip Pertanahan Kelurahan Loktuan</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Fraunces:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f5;--bg2:#f3efe9;--card:#fff;--border:#e8e2d9;--border2:#d5cdc2;
  --text:#2a2318;--t2:#6b6054;--t3:#a39888;--t4:#c4baa8;
  --pri:#c26a2a;--pri2:#a85620;--priL:#fef6f0;--priB:rgba(194,106,42,.08);
  --blue:#2878a0;--blueL:#eef6fb;--green:#2a8058;--greenL:#edf7f1;
  --purple:#7050aa;--purpleL:#f2eefa;--red:#c04040;--redL:#fdf0f0;
  --amber:#a07818;--amberL:#fdf8ee;--dark:#201c16;--dark2:#302a22;--dark3:#403830;
  --r:12px;--rl:16px;--rr:20px;
  --font:'Outfit',sans-serif;--head:'Fraunces',serif;
  --sh:0 1px 3px rgba(42,35,24,.06);--sh2:0 4px 16px rgba(42,35,24,.08);--sh3:0 12px 40px rgba(42,35,24,.12);
  --ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:13px}
table{border-collapse:collapse;width:100%}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--t4);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--t3)}
::selection{background:rgba(194,106,42,.15)}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,106,42,.2)}50%{box-shadow:0 0 0 8px rgba(194,106,42,0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.anim-up{animation:fadeUp .4s var(--ease) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}

/* ═══ LOGIN ═══ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:linear-gradient(160deg,#1a1610 0%,#2a2218 35%,#382e22 60%,#2a2218 100%)}
.login-bg::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.login-bg::after{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(194,106,42,.08),transparent 65%);top:-150px;right:-100px}
.login-orb{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(40,120,160,.06),transparent 65%);bottom:-80px;left:-60px}
.login-box{width:400px;max-width:92vw;z-index:1;animation:fadeUp .6s var(--ease) both}
.login-brand{text-align:center;margin-bottom:28px}
.login-brand .ico{width:56px;height:56px;border-radius:16px;background:linear-gradient(140deg,var(--pri),var(--pri2));display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 6px 24px rgba(194,106,42,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.login-brand h1{font-family:var(--head);color:#fff;font-size:24px;font-weight:800;letter-spacing:-.3px}
.login-brand p{color:rgba(255,255,255,.35);font-size:12px;margin-top:3px;font-weight:400;letter-spacing:.5px}
.login-form{background:#fff;border-radius:var(--rr);padding:32px;box-shadow:var(--sh3);border:1px solid rgba(255,255,255,.1)}
.login-form h2{font-size:16px;font-weight:700;margin-bottom:20px;color:var(--text)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--bg);transition:all .2s var(--ease);color:var(--text);font-weight:500}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--priB);background:#fff}
.fg input::placeholder{color:var(--t4);font-weight:400}
.btn-login{width:100%;padding:13px;border-radius:var(--r);color:#fff;font-weight:700;font-size:13px;background:linear-gradient(140deg,var(--pri),var(--pri2));letter-spacing:.3px;transition:all .25s var(--ease);position:relative;overflow:hidden}
.btn-login:hover{box-shadow:0 4px 16px rgba(194,106,42,.3);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0);box-shadow:0 2px 8px rgba(194,106,42,.2)}
.err-box{background:var(--redL);border:1px solid #e8c4c4;color:var(--red);font-size:12px;padding:10px 14px;border-radius:var(--r);margin-bottom:14px;display:none;align-items:center;gap:8px;font-weight:500}
.demo-sec{margin-top:20px;padding-top:18px;border-top:1.5px solid var(--border)}
.demo-sec h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px}
.demo-item{width:100%;text-align:left;padding:10px 14px;border-radius:10px;background:var(--bg);border:1.5px solid var(--border);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;transition:all .15s var(--ease);font-size:12px;font-weight:500}
.demo-item:hover{background:var(--priL);border-color:var(--pri);transform:translateX(2px)}
.rtag{font-size:9px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.3px}
.rt-a{background:var(--redL);color:var(--red)}.rt-o{background:var(--blueL);color:var(--blue)}.rt-v{background:var(--bg2);color:var(--t3)}

/* ═══ LAYOUT ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;position:relative}
.sidebar::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02))}
.sb-top{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.05)}
.sb-top-inner{display:flex;align-items:center;gap:12px}
.sb-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(194,106,42,.25)}
.sb-top h3{color:#fff;font-size:13px;font-weight:800;letter-spacing:.2px}
.sb-top small{color:rgba(255,255,255,.25);font-size:9px;display:block;margin-top:1px;letter-spacing:.5px;text-transform:uppercase}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.sb-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.15);padding:14px 12px 6px}
.nb{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:rgba(255,255,255,.4);font-size:13px;font-weight:500;transition:all .15s var(--ease);margin-bottom:2px;position:relative}
.nb:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.75)}
.nb.on{background:rgba(255,255,255,.08);color:#fff;font-weight:600}
.nb.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--pri)}
.nb svg{width:17px;height:17px;flex-shrink:0;opacity:.7}
.nb.on svg{opacity:1;color:var(--pri)}
.sb-bot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.05)}
.sb-bot .uinfo{padding:0 4px;margin-bottom:10px}
.sb-bot .uinfo strong{color:rgba(255,255,255,.7);display:block;font-size:12px;font-weight:600}
.sb-bot .uinfo span{color:rgba(255,255,255,.25);font-size:10px}
.logout-btn{width:100%;padding:9px 12px;border-radius:10px;color:rgba(200,120,120,.7);font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;transition:all .15s var(--ease)}
.logout-btn:hover{background:rgba(200,120,120,.08);color:rgba(200,120,120,.9)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.header{background:var(--card);border-bottom:1.5px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h2{font-family:var(--head);font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.header small{font-size:11px;color:var(--t3);font-weight:400}
.page{flex:1;overflow-y:auto;padding:24px 28px}

/* ═══ COMPONENTS ═══ */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh);transition:box-shadow .2s var(--ease)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
.b-b{background:var(--blueL);color:var(--blue)}.b-g{background:var(--greenL);color:var(--green)}.b-a{background:var(--amberL);color:var(--amber)}.b-r{background:var(--redL);color:var(--red)}.b-x{background:var(--bg2);color:var(--t3)}.b-p{background:var(--purpleL);color:var(--purple)}.b-o{background:var(--priL);color:var(--pri)}

.btn{padding:9px 18px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s var(--ease);letter-spacing:.2px}
.btn svg{width:15px;height:15px}
.btn-pri{background:linear-gradient(140deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 2px 8px rgba(194,106,42,.15)}
.btn-pri:hover{box-shadow:0 4px 16px rgba(194,106,42,.25);transform:translateY(-1px)}
.btn-grn{background:linear-gradient(140deg,var(--green),#1e6e48);color:#fff}.btn-grn:hover{box-shadow:0 3px 12px rgba(42,128,88,.2);transform:translateY(-1px)}
.btn-pur{background:linear-gradient(140deg,var(--purple),#5a3a90);color:#fff}.btn-pur:hover{box-shadow:0 3px 12px rgba(112,80,170,.2);transform:translateY(-1px)}
.btn-dk{background:var(--dark);color:#fff}.btn-dk:hover{background:var(--dark2)}
.btn-ghost{border:1.5px solid var(--border);color:var(--t2);background:var(--card)}.btn-ghost:hover{background:var(--bg);border-color:var(--border2)}

.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s var(--ease)}
.icon-btn svg{width:15px;height:15px}
.icon-btn:hover{transform:scale(1.08)}
.ib-v{color:var(--blue)}.ib-v:hover{background:var(--blueL)}.ib-e{color:var(--pri)}.ib-e:hover{background:var(--priL)}.ib-d{color:var(--red)}.ib-d:hover{background:var(--redL)}.ib-p{color:var(--purple)}.ib-p:hover{background:var(--purpleL)}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.toolbar p{font-size:12px;color:var(--t3);font-weight:400}

/* Tables */
table th{padding:10px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);background:var(--bg2);border-bottom:1.5px solid var(--border)}
table td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--t2);transition:background .1s}
table tr:hover td{background:var(--priB)}
td.bld{font-weight:700;color:var(--text)}
table th:first-child{border-radius:var(--rl) 0 0 0}
table th:last-child{border-radius:0 var(--rl) 0 0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rl);padding:20px;cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 0 0 80px;opacity:.04;transition:opacity .2s}
.stat:nth-child(1)::after{background:var(--amber)}.stat:nth-child(2)::after{background:var(--blue)}.stat:nth-child(3)::after{background:var(--green)}.stat:nth-child(4)::after{background:var(--purple)}
.stat:hover{box-shadow:var(--sh2);transform:translateY(-3px);border-color:var(--border2)}
.stat-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.stat-ico svg{width:19px;height:19px}
.stat-num{font-size:28px;font-weight:900;color:var(--text);letter-spacing:-.5px;font-family:var(--head)}
.stat-lbl{font-size:11px;color:var(--t3);font-weight:500;margin-top:2px}

.grid-2col{display:grid;grid-template-columns:1fr 2fr;gap:18px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(32,28,22,.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fadeIn .15s var(--ease)}
.modal{background:var(--card);border-radius:var(--rr);width:560px;max-width:96vw;box-shadow:var(--sh3);animation:slideIn .25s var(--ease);border:1px solid var(--border)}
.modal.w{width:740px}.modal.xw{width:900px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1.5px solid var(--border);position:sticky;top:0;background:var(--card);border-radius:var(--rr) var(--rr) 0 0;z-index:2}
.modal-h h3{font-size:15px;font-weight:700;font-family:var(--head)}
.modal-x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t3);transition:all .12s}
.modal-x:hover{background:var(--bg2);color:var(--text)}
.modal-b{padding:24px;max-height:75vh;overflow-y:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.factions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1.5px solid var(--border)}

/* ═══ LACAKTANAH ═══ */
.lt-hero{background:var(--card);border:2px solid var(--pri);border-radius:var(--rr);padding:28px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(194,106,42,.06)}
.lt-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(194,106,42,.06),transparent 70%)}
.lt-hero::after{content:'';position:absolute;bottom:-30px;left:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(40,120,160,.04),transparent 70%)}
.lt-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(140deg,var(--pri),var(--pri2));color:#fff;font-size:10px;font-weight:800;padding:5px 14px;border-radius:8px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px;box-shadow:0 2px 8px rgba(194,106,42,.2)}
.lt-title{font-family:var(--head);font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px}
.lt-desc{font-size:12px;color:var(--t2);max-width:600px;line-height:1.7;position:relative;z-index:1}
.lt-search{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1}
.lt-input-w{flex:1;position:relative}
.lt-input-w svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--t4)}
.lt-input{width:100%;padding:14px 18px 14px 48px;border:2px solid var(--border);border-radius:var(--r);font-size:14px;background:var(--bg);transition:all .25s var(--ease);font-weight:500}
.lt-input:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 5px var(--priB)}
.lt-select{padding:14px 20px;border:2px solid var(--border);border-radius:var(--r);font-size:12px;font-weight:600;background:var(--bg);min-width:160px;transition:all .2s var(--ease)}
.lt-select:focus{outline:none;border-color:var(--pri)}
.lt-tags{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.lt-tag{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(--border);color:var(--t2);background:var(--card);transition:all .15s var(--ease)}
.lt-tag:hover{border-color:var(--pri);color:var(--pri);background:var(--priL);transform:translateY(-1px)}

/* Result card */
.res-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rr);overflow:hidden;margin-bottom:18px;box-shadow:var(--sh);transition:all .2s var(--ease)}
.res-card:hover{box-shadow:var(--sh2)}
.res-top{padding:20px 24px;background:linear-gradient(135deg,var(--bg),var(--bg2));border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.res-title{font-family:var(--head);font-size:18px;font-weight:800;letter-spacing:-.2px}
.res-sub{font-size:11px;color:var(--t3);margin-top:3px;font-weight:400}
.res-owner .ro-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);font-weight:700}
.res-owner .ro-name{font-family:var(--head);font-size:16px;font-weight:700;color:var(--pri2)}
.res-owner .ro-luas{font-size:10px;color:var(--t3);margin-top:2px}

/* Chain */
.chain-area{padding:16px 24px;background:var(--priB);border-bottom:1px solid var(--border);overflow-x:auto}
.chain-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:10px}
.chain-row{display:flex;align-items:center;min-width:max-content}
.chain-node{text-align:center}
.chain-pill{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid var(--border);background:var(--card);color:var(--t2);transition:all .15s var(--ease)}
.chain-pill:hover{border-color:var(--pri);color:var(--pri)}
.chain-pill.now{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(194,106,42,.2)}
.chain-pill.hl{border-color:var(--pri);color:var(--pri);background:var(--priL)}
.chain-yr{font-size:9px;color:var(--t3);font-weight:600;margin-top:3px}
.chain-arr{width:36px;display:flex;align-items:center;justify-content:center;color:var(--t4);flex-shrink:0}
.chain-arr svg{width:18px;height:18px}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border);padding:0 24px;background:var(--bg)}
.tab{padding:12px 18px;font-size:12px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s var(--ease);display:flex;align-items:center;gap:6px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.tab svg{width:14px;height:14px}
.tab-body{padding:24px;display:none}.tab-body.on{display:block}

/* Timeline */
.tl{position:relative;padding-left:32px}
.tl-line{position:absolute;left:13px;top:8px;bottom:8px;width:3px;border-radius:2px;background:linear-gradient(180deg,var(--green),var(--amber),var(--pri))}
.tl-n{position:relative;padding-bottom:20px}.tl-n:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:4px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1}
.tl-dot.first{background:var(--green);box-shadow:0 0 0 4px var(--greenL)}
.tl-dot.mid{background:var(--amber);box-shadow:0 0 0 4px var(--amberL)}
.tl-dot.now{background:var(--pri);box-shadow:0 0 0 4px var(--priL);animation:pulse 2.5s ease infinite}
.tl-dot svg{width:8px;height:8px;fill:#fff;stroke:#fff;stroke-width:2}
.tl-card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);padding:16px 18px;transition:all .2s var(--ease);position:relative}
.tl-card:hover{box-shadow:var(--sh);background:var(--card);border-color:var(--border2)}

/* Info boxes */

function ltS(){

    let lcT='',lcB='';
    p.lc.forEach((lc,li)=>{const act=li===0;
      lcT+=`<div class="tab ${act?'on':''}" onclick="ltTab(${p.id},${li})" id="ltT_${p.id}_${li}">${SVG.book} ${h(lc.nc)} ${lc.st.startsWith('Aktif')?bg('Aktif','g'):bg(lc.st,'a')}</div>`;
      let tl='';lc.rw.forEach((r,ri)=>{const isL=ri===lc.rw.length-1,isF=ri===0;const dot=isL&&!r.a?'now':isF?'first':'mid';const hl2=r.pm.toLowerCase().includes(q);
        tl+=`<div class="tl-n"><div class="tl-dot ${dot}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="${isL&&!r.a?'4':'3'}"/></svg></div><div class="tl-card ${isL&&!r.a?'now':''} ${hl2?'now':''}"><div class="dur">${dur(r.m,r.a)}</div><div class="owner">${hl2?'<span style="background:var(--priB);padding:1px 5px;border-radius:4px">'+h(r.pm)+'</span>':h(r.pm)} ${isL&&!r.a?bg('PEMILIK SAAT INI','o'):''}</div><div class="period">${SVG.clock} ${fD(r.m)} — ${fD(r.a)}</div><div class="mutasi m-${mC(r.j)}">${r.j}</div>${r.ak&&r.ak!=='-'?`<div class="ket">📄 ${h(r.ak)}</div>`:''}${r.k?`<div class="ket">${h(r.k)}</div>`:''}</div></div>`;});
      lcB+=`<div class="tab-body ${act?'on':''}" id="ltB_${p.id}_${li}"><div class="tl"><div class="tl-line"></div>${tl}</div></div>`;
    });
    let docsH='';p.dok.forEach(d=>{docsH+=`<div class="doc-item"><div class="doc-ico ${d.t}">${SVG.file}</div><div class="doc-name">${h(d.n)}</div><div class="doc-meta">${d.u} · ${d.tg}</div></div>`;});
    let skH=relSK.length?relSK.map(s=>`<div style="background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:6px"><div style="display:flex;justify-content:space-between"><span style="font-weight:700;font-size:11px">${h(s.no)}</span>${bg(s.st,'g')}</div><div style="font-size:10px;color:var(--t3);margin-top:3px">${h(s.pm)} · ${fD(s.tg)} · ${s.lu} m²</div></div>`).join(''):'<div style="font-size:11px;color:var(--t3);font-style:italic">Belum ada SKT.</div>';
    let spH=relSP.length?relSP.map(s=>{const sc=s.sb==='Selesai'?'g':s.sb==='Diproses'?'a':'x';return`<div style="background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:6px"><div style="display:flex;justify-content:space-between"><span style="font-weight:700;font-size:11px">${h(s.no)}</span>${bg(s.sb,sc)}</div><div style="font-size:10px;color:var(--t3);margin-top:3px">${h(s.pm)} · ${h(s.tj)}</div></div>`;}).join(''):'<div style="font-size:11px;color:var(--t3);font-style:italic">Belum ada surat pengantar.</div>';
    x+=`<div class="res-card anim-up"><div class="res-top"><div><div class="res-title">Persil ${h(p.np)}</div><div class="res-sub">${h(p.al)}, Kel. Loktuan · ${p.kl} · ${p.lc.length} Letter C</div></div><div class="res-owner"><div class="ro-label">Pemilik Saat Ini</div><div class="ro-name">${h(ow.join(', '))}</div><div class="ro-luas">${p.lu.toLocaleString()} m²</div></div></div>

  <button class="id-scan-btn" id="idScanBtn" onclick="idScan()" disabled>${SVG.search} Scan & Isi Otomatis (OCR)</button>
  </div></div>
  <div class="id-form" id="idFormArea"><h3>${SVG.file} Data Dokumen</h3><div id="idFields"><div class="empty" style="padding:30px"><p style="font-size:12px;color:var(--t3)">Pilih jenis dokumen terlebih dahulu</p></div></div></div></div></div>`;
}

function idTypeChange(){
  const sel=document.getElementById('idType').value;
  if(!sel){document.getElementById('idFields').innerHTML='<div class="empty" style="padding:30px"><p style="font-size:12px;color:var(--t3)">Pilih jenis dokumen terlebih dahulu</p></div>';return;}
  const dt=DOC_TYPES.find(d=>d.id===sel);
  let fields='<div class="fgrid">';
  dt.fields.forEach(f=>{
    const lbl=FIELD_LABELS[f]||f;
    const isDate=f.includes('tgl')||f==='tahun';
    fields+=`<div class="fg"><label>${lbl}</label><input id="idf_${f}" ${isDate?'type="date"':''} placeholder="${lbl}"></div>`;
  });
  fields+=`</div><div class="factions"><button class="btn btn-ghost" onclick="idReset()">Reset</button><button class="btn btn-pri" onclick="idSave()">Simpan ke Arsip</button></div>`;
  document.getElementById('idFields').innerHTML=fields;
  idScanned=false;
}

function idFileChange(e){const f=e.target.files[0];if(f)idLoadImg(f);}
function idDrop(e){e.preventDefault();e.currentTarget.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))idLoadImg(f);}
function idLoadImg(file){
  const reader=new FileReader();
  reader.onload=e=>{
    idImg=e.target.result;
    document.getElementById('idPreview').innerHTML=`<img src="${idImg}" alt="Dokumen">`;
    document.getElementById('idZone').classList.add('has-img');
    document.getElementById('idScanBtn').disabled=!document.getElementById('idType').value;
  };reader.readAsDataURL(file);
}

function idScan(){
  const sel=document.getElementById('idType').value;
  if(!sel||!idImg){idNotify('⚠ Pilih jenis dokumen dan upload gambar terlebih dahulu.','warn');return;}
  const btn=document.getElementById('idScanBtn');
  btn.classList.add('scanning');btn.disabled=true;btn.innerHTML='⏳ Memindai dokumen...';
  setTimeout(()=>{
    btn.classList.remove('scanning');btn.disabled=false;btn.innerHTML=SVG.search+' Scan & Isi Otomatis (OCR)';
    const dt=DOC_TYPES.find(d=>d.id===sel);
    const mockData=getMockOCR(sel);
    dt.fields.forEach(f=>{
      const inp=document.getElementById('idf_'+f);
      if(inp&&mockData[f]){inp.value=mockData[f];inp.classList.add('scanned');}
    });
    idScanned=true;
    const formArea=document.getElementById('idFormArea');
    const existingStatus=formArea.querySelector('.id-status');
    if(existingStatus)existingStatus.remove();
    formArea.insertAdjacentHTML('afterbegin','<div class="id-status success">✓ Scan berhasil! Data telah diisi otomatis. Silakan periksa dan perbaiki jika ada kesalahan.</div>');
  },2000);
}

function getMockOCR(type){
  const mocks={
    letterc:{no_letterc:'C.005',nama_pemilik:'H. Syarifuddin',no_persil:'P.25a',kelas_tanah:'Darat',luas:'520',alamat:'Jl. Nusantara RT.07',tgl_pencatatan:'2024-03-15'},
    skt:{no_skt:'593.2/SKT/003/KEL-LKT/V/2026',tgl_terbit:'2026-05-05',nama_pemohon:'H. Syarifuddin',no_letterc:'C.005',no_persil:'P.25a',lokasi:'Jl. Nusantara RT.07',luas:'520',batas_utara:'Tanah H. Malik',batas_selatan:'Jalan Raya',batas_timur:'Tanah Arifin',batas_barat:'Sungai Kecil'},
    sp:{no_surat:'593.3/SP/002/KEL-LKT/V/2026',tgl_surat:'2026-05-06',nama_pemohon:'H. Syarifuddin',no_letterc:'C.005',no_persil:'P.25a',tujuan:'Pendaftaran Tanah Pertama Kali'},
    sppt:{nop:'64.72.010.005.012.0045.0',tahun:'2026',nama_wp:'H. Syarifuddin',alamat_op:'Jl. Nusantara RT.07',luas_tanah:'520',luas_bangunan:'120',njop_tanah:'156000000',njop_bangunan:'84000000',pbb_terutang:'245000'},
    ajb:{no_akta:'89/JB/2026',tgl_akta:'2026-04-28',penjual:'Ahmad Dahlan',pembeli:'H. Syarifuddin',no_persil:'P.25a',luas:'520',harga:'350000000',ppat:'Notaris Suhendra, SH'},
    waris:{no_surat:'KW/15/V/2026',tgl_surat:'2026-05-01',nama_pewaris:'Alm. H. Bakar',ahli_waris:'H. Syarifuddin, Aminah, Yusuf',no_persil:'P.25a',luas:'520',keterangan:'Berdasarkan musyawarah keluarga'},
    hibah:{no_akta:'12/HIB/2026',tgl_akta:'2026-04-20',pemberi:'H. Bakar',penerima:'H. Syarifuddin',no_persil:'P.25a',luas:'520',keterangan:'Hibah tanah untuk anak sulung'},
    lainnya:{judul_dokumen:'Surat Pernyataan Penguasaan Fisik',no_dokumen:'SPF/21/V/2026',tgl_dokumen:'2026-05-03',pihak_terkait:'H. Syarifuddin',keterangan:'Penguasaan fisik bidang tanah P.25a'}
  };
  return mocks[type]||{};
}

function idReset(){
  const sel=document.getElementById('idType').value;
  if(!sel)return;
  const dt=DOC_TYPES.find(d=>d.id===sel);
  dt.fields.forEach(f=>{const inp=document.getElementById('idf_'+f);if(inp){inp.value='';inp.classList.remove('scanned');}});
  idScanned=false;
  const formArea=document.getElementById('idFormArea');
  const st=formArea.querySelector('.id-status');if(st)st.remove();
}

function idNotify(msg,type){
  const formArea=document.getElementById('idFormArea');
  const old=formArea.querySelector('.id-status');if(old)old.remove();
  formArea.insertAdjacentHTML('afterbegin',`<div class="id-status ${type}">${msg}</div>`);
  if(type==='success')setTimeout(()=>{const el=formArea.querySelector('.id-status.success');if(el)el.style.opacity='0';},4000);
}
function idSave(){
  const sel=document.getElementById('idType').value;
  if(!sel){idNotify('⚠ Pilih jenis dokumen terlebih dahulu.','warn');return;}
  const dt=DOC_TYPES.find(d=>d.id===sel);
  const data={};let hasData=false;
  dt.fields.forEach(f=>{const inp=document.getElementById('idf_'+f);if(inp&&inp.value.trim()){data[f]=inp.value.trim();hasData=true;}});
  if(!hasData){idNotify('⚠ Isi minimal satu field data.','warn');return;}
  const folder=arsipFolders.find(f=>f.id===sel)||arsipFolders.find(f=>f.id==='lainnya');
  if(folder){
    folder.files.push({id:Date.now(),name:dt.name+' — '+(data.nama_pemilik||data.nama_pemohon||data.nama_wp||data.pihak_terkait||'Dokumen'),date:new Date().toISOString().split('T')[0],data,hasImage:!!idImg,type:sel});
  }
  aL('Tambah','Input Dokumen','Scan & input '+dt.name);
  idImg=null;idScanned=false;
  idTypeChange();
  document.getElementById('idPreview').innerHTML='<div class="id-upload-ico">'+SVG.upload+'</div><h4>Klik atau seret gambar ke sini</h4><p>Format: JPG, PNG, JPEG — Maks 10MB</p>';
  document.getElementById('idZone').classList.remove('has-img');
  document.getElementById('idScanBtn').disabled=true;
  idNotify('✓ Dokumen berhasil disimpan ke arsip! Buka menu Arsip Digital untuk melihat.','success');
}

// Arsip Digital
let arsipFolders=[
  {id:'letterc',name:'Letter C / Buku C',color:'amber',icon:'book',files:[]},
  {id:'skt',name:'SKT',color:'green',icon:'fc',files:[]},
  {id:'sp',name:'Surat Pengantar',color:'purple',icon:'file',files:[]},
  {id:'sppt',name:'SPPT PBB',color:'blue',icon:'file',files:[]},
  {id:'ajb',name:'Akta Jual Beli',color:'pri',icon:'file',files:[]},
  {id:'waris',name:'Surat Waris',color:'amber',icon:'file',files:[]},
  {id:'hibah',name:'Akta Hibah',color:'green',icon:'file',files:[]},
  {id:'lainnya',name:'Lainnya',color:'x',icon:'folder',files:[]}
];
let arsipView='folders',arsipCurFolder=null;

function rArsip(){
  if(arsipView==='files'&&arsipCurFolder){return rArsipFiles();}
  let folders='';
  arsipFolders.forEach(f=>{
    const cnt=f.files.length;
    const isDefault=['letterc','skt','sp','sppt','ajb','waris','hibah','lainnya'].includes(f.id);
    folders+=`<div class="arsip-folder anim-up" onclick="openArsipFolder('${f.id}')"><div class="af-ico" style="background:var(--${f.color}L);color:var(--${f.color})">${SVG[f.icon]||SVG.folder}</div><div class="af-name">${h(f.name)}</div><div class="af-count">${cnt} dokumen</div>${!isDefault?`<button class="af-del" onclick="event.stopPropagation();delArsipFolder('${f.id}')" title="Hapus folder">${SVG.x}</button>`:''}</div>`;
  });
  return`<div class="toolbar"><p>Kelola arsip dokumen digital dalam folder-folder terorganisir.</p><button class="btn btn-pri" onclick="addArsipFolder()">${SVG.plus} Tambah Folder</button></div>
  <div class="stats" style="grid-template-columns:repeat(3,1fr)">${[['Total Folder',arsipFolders.length,'amberL','amber'],['Total Dokumen',arsipFolders.reduce((a,f)=>a+f.files.length,0),'blueL','blue'],['Folder Kustom',arsipFolders.filter(f=>!['letterc','skt','sp','sppt','ajb','waris','hibah','lainnya'].includes(f.id)).length,'greenL','green']].map(s=>`<div class="stat"><div class="stat-ico" style="background:var(--${s[2]});color:var(--${s[3]})">${SVG.folder}</div><div class="stat-num">${s[1]}</div><div class="stat-lbl">${s[0]}</div></div>`).join('')}</div>
  <div class="arsip-grid">${folders}<div class="arsip-add" onclick="addArsipFolder()"><div class="af-ico">${SVG.plus}</div><div class="af-name" style="color:var(--pri)">Tambah Folder Baru</div><div class="af-count">Buat kategori baru</div></div></div>`;
}

function rArsipFiles(){
  const f=arsipFolders.find(x=>x.id===arsipCurFolder);
  if(!f)return rArsip();
  let files='';
  if(f.files.length===0){files=`<div class="empty" style="grid-column:1/-1">${SVG.folder}<h3>Folder kosong</h3><p>Belum ada dokumen di folder ini. Gunakan menu Input Dokumen untuk menambahkan.</p></div>`;}
  else{f.files.forEach(fl=>{
    let detail='';
    if(fl.data){const keys=Object.keys(fl.data).slice(0,3);keys.forEach(k=>{detail+=`<div style="font-size:10px;color:var(--t3);margin-top:2px"><span style="font-weight:600">${FIELD_LABELS[k]||k}:</span> ${h(fl.data[k])}</div>`;});}
    files+=`<div class="arsip-file"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:12px;font-weight:700;color:var(--text)">${h(fl.name)}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${fl.date}</div></div><div style="display:flex;gap:4px">${fl.hasImage?'<span class="badge b-b">📷 Gambar</span>':''}<button class="icon-btn ib-d" onclick="delArsipFile('${f.id}',${fl.id})">${SVG.trash}</button></div></div>${detail}</div>`;
  });}
  return`<div class="arsip-breadcrumb"><button onclick="arsipBack()">Arsip</button><span>›</span><span style="font-weight:700;color:var(--text)">${h(f.name)}</span></div>
  <div class="toolbar"><p>${f.files.length} dokumen dalam folder ini.</p><button class="btn btn-ghost" onclick="arsipBack()">${SVG.arr} Kembali</button></div>
  <div class="arsip-file-grid">${files}</div>`;
}

function openArsipFolder(id){arsipCurFolder=id;arsipView='files';render();}
function arsipBack(){arsipView='folders';arsipCurFolder=null;render();}

function addArsipFolder(){
  sM('Tambah Folder Arsip',`<div class="fgrid"><div class="fg full"><label>Nama Folder *</label><input id="afN" placeholder="Nama kategori folder"></div><div class="fg full"><label>Warna</label><select id="afC"><option value="amber">Amber</option><option value="blue">Biru</option><option value="green">Hijau</option><option value="purple">Ungu</option><option value="pri">Oranye</option><option value="red">Merah</option></select></div></div><div class="factions"><button class="btn btn-ghost" onclick="cM()">Batal</button><button class="btn btn-pri" onclick="saveArsipFolder()">Simpan</button></div>`);
}
function saveArsipFolder(){
  const nm=document.getElementById('afN').value.trim();
  if(!nm){return;}
  arsipFolders.push({id:'custom_'+Date.now(),name:nm,color:document.getElementById('afC').value,icon:'folder',files:[]});
  aL('Tambah','Arsip','Buat folder '+nm);cM();render();
}
function delArsipFolder(id){
  const f=arsipFolders.find(x=>x.id===id);
  if(!confirm('Hapus folder "'+f.name+'"?'))return;
  arsipFolders=arsipFolders.filter(x=>x.id!==id);
  aL('Hapus','Arsip','Hapus folder '+f.name);render();
}
function delArsipFile(folderId,fileId){
  if(!confirm('Hapus dokumen ini?'))return;
  const f=arsipFolders.find(x=>x.id===folderId);
  f.files=f.files.filter(x=>x.id!==fileId);
  aL('Hapus','Arsip','Hapus dokumen dari '+f.name);render();
}

// Modal
function sM(t,b,c){const o=document.createElement('div');o.className='modal-bg';o.id='mO';o.onclick=ev=>{if(ev.target===o)cM();};o.innerHTML=`<div class="modal ${c||''}"><div class="modal-h"><h3>${t}</h3><button class="modal-x" onclick="cM()">${SVG.x}</button></div><div class="modal-b">${b}</div></div>`;document.body.appendChild(o);}
function cM(){const o=document.getElementById('mO');if(o)o.remove();}
</script>
</body>
</html>
