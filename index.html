                      {a.rekonstruksi && <Badge variant="warning">Rekonstruksi historis</Badge>}
                    </div>
                    <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 14, alignItems: "center" }}>
                      <div style={{ background: "var(--bg-soft)", border: "1px solid var(--line)", borderRadius: 10, padding: 12 }}>
                        <div style={{ fontSize: 11, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Pengalih · {a.pengalih.peran || "—"}</div>
                        <div style={{ fontWeight: 600, marginTop: 4 }}>{a.pengalih.nama}</div>
                        <div className="mono" style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 2 }}>{SIADP.maskNik(a.pengalih.nik)}</div>
                        <div style={{ marginTop: 6 }}><StatusBadge status={a.pengalih.status}/></div>
                      </div>
                      <Icon name="chevron-right" size={20} stroke={2}/>
                      <div style={{ background: "var(--primary-soft)", border: "1px solid transparent", borderRadius: 10, padding: 12 }}>
                        <div style={{ fontSize: 11, color: "var(--primary-ink)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Penerima</div>
                        <div style={{ fontWeight: 600, marginTop: 4 }}>{a.penerima.nama}</div>
                        <div className="mono" style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 2 }}>{SIADP.maskNik(a.penerima.nik)}</div>
                        <div style={{ marginTop: 6, fontSize: 11.5, color: "var(--ink-3)" }}>{a.penerima.jk} · {a.penerima.telp}</div>
                      </div>
                    </div>
                    {a.catatan && <div style={{ marginTop: 10, fontSize: 12.5, color: "var(--ink-2)", fontStyle: "italic" }}>“{a.catatan}”</div>}
                    <div style={{ marginTop: 12, display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {a.dokumen.map((d, j) => (
                        <button key={j} className="chip" onClick={() => openDoc(a, d)}>
                          <Icon name="file-text" size={12}/>{d}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="col">
          <div className="card card-pad">
            <h3 style={{ margin: 0, fontSize: 14 }}>Batas Tanah</h3>
            <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              {[["Utara", p.batas.utara], ["Selatan", p.batas.selatan], ["Timur", p.batas.timur], ["Barat", p.batas.barat]].map(([k, v]) => (
                <div key={k} style={{ padding: "10px 12px", background: "var(--bg-soft)", border: "1px solid var(--line)", borderRadius: 10 }}>
                  <div style={{ fontSize: 10.5, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.08em" }}>{k}</div>
                  <div style={{ fontSize: 12.5, marginTop: 3, color: "var(--ink-1)", fontWeight: 500 }}>{v || "—"}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="card card-pad">
            <h3 style={{ margin: 0, fontSize: 14 }}>Validasi Server-side</h3>
            <div style={{ color: "var(--ink-3)", fontSize: 11.5, marginTop: 2 }}>Log dari proses validasi terakhir</div>
            <div className="terminal" style={{ marginTop: 12 }}>
              <div><span className="prompt">$</span> siadp validate parcel {p.kode}</div>
              <div className="dim">[INFO] memvalidasi struktur persil…</div>
              <div className="ok">[ OK ] kode persil unik ✓</div>
              <div className="ok">[ OK ] luas dan alamat lengkap ✓</div>
              {archives.length > 0
                ? <div className="ok">[ OK ] chain-of-title {archives.length} simpul utuh ✓</div>
                : <div className="warn">[WARN] belum ada arsip SPPHT terkait</div>}
              {p.status === "sengketa"
                ? <div className="err">[ERR ] persil ditandai SENGKETA — peralihan ditangguhkan</div>
                : <div className="ok">[ OK ] status persil siap untuk peralihan baru ✓</div>}
              <div className="dim">selesai dalam 84ms</div>
            </div>
          </div>
        </div>
      </div>

      {/* Doc preview modal */}
      <Modal
        open={!!previewDoc}
        onClose={() => setPreviewDoc(null)}
        title={previewDoc ? `Pratinjau: ${previewDoc.doc}` : ""}
        subtitle={previewDoc ? `${previewDoc.archive.nomorSPPHT} · ${SIADP.formatDate(previewDoc.archive.tanggal)}` : ""}
        size="lg"
        footer={<>
          <Btn variant="ghost" icon="x" onClick={() => setPreviewDoc(null)}>Tutup</Btn>
          <Btn variant="subtle" icon="upload">Unduh salinan</Btn>
        </>}
      >
        {previewDoc && (
          <div className="doc-preview">
            <div style={{ textAlign: "center", fontWeight: 700, fontSize: 13, color: "var(--ink-1)", letterSpacing: "0.1em" }}>— {previewDoc.doc.toUpperCase()} —</div>
            <div style={{ marginTop: 16 }}>Nomor SPPHT: <b>{previewDoc.archive.nomorSPPHT}</b></div>
            <div>Persil: {p.kode} — {p.alamat}</div>
            <div>Jenis peralihan: {previewDoc.archive.jenis}</div>
            <div>Tanggal: {SIADP.formatDate(previewDoc.archive.tanggal)}</div>
            <div style={{ marginTop: 14 }}>Pengalih: {previewDoc.archive.pengalih.nama} · NIK {SIADP.maskNik(previewDoc.archive.pengalih.nik)}</div>
            <div>Penerima: {previewDoc.archive.penerima.nama} · NIK {SIADP.maskNik(previewDoc.archive.penerima.nik)}</div>
            <div style={{ marginTop: 18, color: "var(--ink-3)" }}>[Halaman pratinjau dokumen — tampilan simulasi untuk uji alur arsip digital]</div>
            <div style={{ marginTop: 8, color: "var(--ink-3)" }}>Sistem akan menampilkan PDF/JPG asli pada implementasi sesungguhnya.</div>
          </div>
        )}
      </Modal>
    </div>
  );
}

// ---------------------------------- DATA PIHAK ----------------------------------
function DataPihak({ state }) {
  const toast = useToast();
  return (
    <div data-screen-label="Data Pihak">
      <div className="card">
        <div className="card-head">
          <div style={{ flex: 1 }}>
            <h3>Data Pihak</h3>
            <div className="sub">Daftar pengalih, penerima, dan pemilik yang terdaftar dalam arsip.</div>
          </div>
          <Btn variant="ghost" icon="plus" onClick={() => toast.info("Pihak baru", "Pihak akan otomatis bertambah ketika arsip baru disimpan.")}>Tambah Pihak</Btn>
        </div>
        <div className="table-wrap">
          <table className="data">
            <thead>
              <tr>
                <th>Nama</th>
                <th>NIK</th>
                <th>Status</th>
                <th>Keterlibatan</th>
                <th>Riwayat terakhir</th>
              </tr>
            </thead>
            <tbody>
              {state.parties.length === 0 && <EmptyRow cols={5} icon="users" title="Belum ada pihak terdaftar"/>}
              {state.parties.map((pt) => (
                <tr key={pt.id}>
                  <td>
                    <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                      <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--bg-soft)", display: "grid", placeItems: "center", fontSize: 12, fontWeight: 700, color: "var(--ink-2)" }}>
                        {pt.nama.split(" ").map((s) => s[0]).slice(0, 2).join("")}
                      </div>
                      <div>
                        <div style={{ fontWeight: 600 }}>{pt.nama}</div>
                      </div>
                    </div>
                  </td>
                  <td className="mono">{SIADP.maskNik(pt.nik)}</td>
                  <td><StatusBadge status={pt.status}/></td>
                  <td><Badge variant="muted">{pt.keterlibatan}</Badge></td>
                  <td>{SIADP.relTime(pt.riwayatTerakhir)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------- AUDIT LOG ----------------------------------
function AuditLog({ state }) {
  const [aksi, setAksi] = useState("");
  const filtered = aksi ? state.audits.filter((a) => a.aksi === aksi) : state.audits;
  const aksiColor = { CREATE: "success", UPDATE: "info", VIEW_FILE: "muted", LOGIN: "primary" };
  return (
    <div data-screen-label="Audit Log">
      <div className="card">
        <div className="card-head">
          <div style={{ flex: 1 }}>
            <h3>Audit Log</h3>
            <div className="sub">Catatan aktivitas append-only · {state.audits.length} aksi tercatat</div>
          </div>
        </div>
        <div className="filter-bar">
          <Field label="Aksi">
            <select className="select" style={{ width: 180 }} value={aksi} onChange={(e) => setAksi(e.target.value)}>
              <option value="">Semua aksi</option>
              <option value="CREATE">CREATE</option>
              <option value="UPDATE">UPDATE</option>
              <option value="VIEW_FILE">VIEW_FILE</option>
              <option value="LOGIN">LOGIN</option>
            </select>
          </Field>
        </div>
        <div className="table-wrap">
          <table className="data">
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Admin</th>
                <th>Aksi</th>
                <th>Entitas</th>
                <th>ID</th>
                <th>IP address</th>
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 && <EmptyRow cols={6} icon="history" title="Tidak ada catatan"/>}
              {filtered.map((a) => (
                <tr key={a.id}>
                  <td>{SIADP.formatDateTime(a.waktu)}</td>
                  <td>{a.admin}</td>
                  <td><Badge variant={aksiColor[a.aksi] || "muted"}>{a.aksi}</Badge></td>
                  <td>{a.entitas}</td>
                  <td className="mono" style={{ fontSize: 11.5 }}>{a.entId}</td>
                  <td className="mono" style={{ fontSize: 11.5 }}>{a.ip}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------- PENGATURAN ----------------------------------
function Pengaturan({ onReset }) {
  const toast = useToast();
  const [pwd, setPwd] = useState({ lama: "", baru: "", konf: "" });
  const submitPwd = () => {
    if (!pwd.lama || !pwd.baru) { toast.error("Field belum lengkap", "Password lama dan baru wajib diisi"); return; }
    if (pwd.baru !== pwd.konf) { toast.error("Konfirmasi tidak cocok"); return; }
    if (pwd.baru.length < 8) { toast.error("Password terlalu pendek", "Minimal 8 karakter"); return; }
    setPwd({ lama: "", baru: "", konf: "" });
    toast.success("Password berhasil diubah");
  };
  return (
    <div data-screen-label="Pengaturan">
      <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 16 }}>
        <div className="card card-pad">
          <h3 style={{ margin: 0, fontSize: 15 }}><Icon name="key" size={16} stroke={2}/> Ganti Password</h3>
          <div style={{ color: "var(--ink-3)", fontSize: 12.5, marginTop: 4 }}>Perbarui password operator. Minimum 8 karakter, gabungan huruf dan angka.</div>
          <div className="col" style={{ marginTop: 16, maxWidth: 360 }}>
            <Field label="Password lama" required><input className="input" type="password" value={pwd.lama} onChange={(e) => setPwd({ ...pwd, lama: e.target.value })}/></Field>
            <Field label="Password baru" required><input className="input" type="password" value={pwd.baru} onChange={(e) => setPwd({ ...pwd, baru: e.target.value })}/></Field>
            <Field label="Konfirmasi password" required><input className="input" type="password" value={pwd.konf} onChange={(e) => setPwd({ ...pwd, konf: e.target.value })}/></Field>
            <Btn variant="primary" icon="save" onClick={submitPwd} style={{ alignSelf: "flex-start", marginTop: 6 }}>Simpan Password</Btn>
          </div>
        </div>

        <div className="col">
          <div className="card card-pad">
            <h3 style={{ margin: 0, fontSize: 15 }}><Icon name="info" size={16} stroke={2}/> Informasi Sistem</h3>
            <dl className="kv" style={{ marginTop: 14 }}>
              <dt>Versi prototype</dt><dd>2.0.0 (simulasi)</dd>
              <dt>Target stack</dt><dd>React + Postgres + S3-compatible</dd>
              <dt>Storage</dt><dd>localStorage browser</dd>
              <dt>Backup terakhir</dt><dd>Sabtu, 10 Mei 2026 · 03:00 WITA</dd>
              <dt>Session timeout</dt><dd>30 menit idle</dd>
            </dl>
          </div>
          <div className="card card-pad">
            <h3 style={{ margin: 0, fontSize: 15, color: "var(--danger)" }}><Icon name="alert" size={16} stroke={2}/> Reset Simulasi</h3>
            <div style={{ color: "var(--ink-3)", fontSize: 12.5, marginTop: 4 }}>Mengembalikan seluruh data (persil, arsip, pihak, audit) ke contoh awal. Tindakan ini tidak bisa dibatalkan.</div>
            <Btn variant="danger" icon="refresh" style={{ marginTop: 14 }} onClick={() => {
              onReset();
              toast.warn("Data simulasi direset", "Semua entitas dikembalikan ke contoh awal");
            }}>Reset Simulasi</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, {
  Dashboard, ArsipSPPHTList, DataTanah, TambahPersilModal,
  DetailRiwayat, DataPihak, AuditLog, Pengaturan,
});

  </script>
  <script type="text/babel">
// SIADP Arsip Baru — wizard 5 langkah
// Step: Persil → Pihak → Peralihan → Dokumen → Review

const DOCS_WAJIB = [
  { key: "SPPHT", wajib: true },
  { key: "KTP pemohon", wajib: true },
  { key: "KK pemohon", wajib: true },
  { key: "Surat pengantar RT/RW", wajib: true },
  { key: "Surat tidak sengketa", wajib: true },
];
const DOCS_OPSIONAL = [
  { key: "KTP saksi 1", wajib: false },
  { key: "KTP saksi 2", wajib: false },
  { key: "Denah lokasi", wajib: false },
  { key: "Dokumen tambahan", wajib: false },
];

function ArsipBaru({ state, setState, go, initialParcelId }) {
  const toast = useToast();
  const [step, setStep] = React.useState(0);
  const [form, setForm] = React.useState({
    parcelId: initialParcelId || "",
    pengalih: { nama: "", nik: "", status: "hidup", peran: "pemilik" },
    penerima: { nama: "", nik: "", jk: "Laki-laki", telp: "", alamat: "" },
    jenis: "Jual Beli",
    tanggal: new Date().toISOString().slice(0, 10),
    nomorSPPHT: "",
    nomorAkta: "",
    catatan: "",
    rekonstruksi: false,
    dokumen: {}, // { key: { uploaded: true/false, progress: 0..100 } }
  });

  // Pre-fill pengalih from parcel pemilikSaatIni when parcel changes
  React.useEffect(() => {
    if (!form.parcelId) return;
    const p = state.parcels.find((x) => x.id === form.parcelId);
    if (p && !form.pengalih.nama) {
      setForm((f) => ({ ...f, pengalih: { ...f.pengalih, nama: p.pemilikSaatIni } }));
    }
    if (p && !form.penerima.alamat) {
      setForm((f) => ({ ...f, penerima: { ...f.penerima, alamat: p.alamat } }));
    }
  }, [form.parcelId]);

  // Auto-generate nomor SPPHT once parcel + tanggal exist
  React.useEffect(() => {
    if (form.parcelId && form.tanggal && !form.nomorSPPHTTouched) {
      const yearArchives = state.archives.filter((a) => new Date(a.tanggal).getFullYear() === new Date(form.tanggal).getFullYear());
      const seq = String(yearArchives.length + 1).padStart(3, "0");
      const month = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"][new Date(form.tanggal).getMonth()];
      setForm((f) => ({ ...f, nomorSPPHT: `SPPHT/${seq}/${month}/${new Date(form.tanggal).getFullYear()}` }));
    }
  }, [form.parcelId, form.tanggal]);

  const selectedParcel = state.parcels.find((p) => p.id === form.parcelId);

  // Chain-of-title validation
  const chainIssue = React.useMemo(() => {
    if (!selectedParcel) return null;
    if (form.rekonstruksi) return null;
    if (form.pengalih.nama && form.pengalih.nama.trim().toLowerCase() !== selectedParcel.pemilikSaatIni.toLowerCase()) {
      return `Pengalih harus cocok dengan pemilik terakhir persil: "${selectedParcel.pemilikSaatIni}". Aktifkan rekonstruksi historis bila ini peralihan masa lampau.`;
    }
    return null;
  }, [selectedParcel, form.pengalih.nama, form.rekonstruksi]);

  const steps = [
    { label: "Persil", desc: "Pilih persil terdaftar", icon: "land" },
    { label: "Pihak", desc: "Pengalih & penerima", icon: "users" },
    { label: "Peralihan", desc: "Jenis & tanggal", icon: "stack" },
    { label: "Dokumen", desc: "Upload bukti", icon: "file-text" },
    { label: "Review", desc: "Periksa & simpan", icon: "check-circle" },
  ];

  const docMandatory = DOCS_WAJIB.every((d) => form.dokumen[d.key]?.uploaded);

  const canNext = (s) => {
    if (s === 0) return !!form.parcelId;
    if (s === 1) return !!form.pengalih.nama && !!form.penerima.nama && !!form.penerima.nik && !chainIssue;
    if (s === 2) return !!form.jenis && !!form.tanggal && !!form.nomorSPPHT;
    if (s === 3) return docMandatory;
    return true;
  };

  const goNext = () => {
    if (!canNext(step)) {
      toast.error("Belum bisa lanjut", "Lengkapi field wajib pada langkah ini.");
      return;
    }
    setStep((s) => Math.min(steps.length - 1, s + 1));
  };
  const goBack = () => setStep((s) => Math.max(0, s - 1));

  const saveDraft = () => {
    setState({ ...state, draft: { ...form, savedAt: new Date().toISOString() } });
    toast.success("Draft tersimpan", "Lanjutkan kapan saja dari halaman Arsip Baru.");
  };

  const resetWizard = () => {
    setForm({
      parcelId: "",
      pengalih: { nama: "", nik: "", status: "hidup", peran: "pemilik" },
      penerima: { nama: "", nik: "", jk: "Laki-laki", telp: "", alamat: "" },
      jenis: "Jual Beli",
      tanggal: new Date().toISOString().slice(0, 10),
      nomorSPPHT: "",
      nomorAkta: "",
      catatan: "",
      rekonstruksi: false,
      dokumen: {},
    });
    setStep(0);
    toast.warn("Wizard direset", "Semua input dikosongkan.");
  };

  const simpanArsip = () => {
    if (!docMandatory) { toast.error("Dokumen wajib belum lengkap"); return; }
    if (chainIssue) { toast.error("Chain of title belum konsisten"); return; }
    const id = "a-" + Date.now();
    const archive = {
      id,
      parcelId: form.parcelId,
      nomorSPPHT: form.nomorSPPHT,
      jenis: form.jenis,
      tanggal: new Date(form.tanggal).toISOString(),
      pengalih: { ...form.pengalih },
      penerima: { ...form.penerima },
      nomorAkta: form.nomorAkta || "—",
      catatan: form.catatan,
      dokumen: Object.keys(form.dokumen).filter((k) => form.dokumen[k]?.uploaded),
      status: "terarsip",
      rekonstruksi: form.rekonstruksi,
    };

    const newParties = [];
    const findOrAdd = (nama, nik, status, peran) => {
      if (!nama) return;
      const exists = state.parties.find((pt) => (nik && pt.nik === nik) || pt.nama === nama);
      if (exists) {
        exists.riwayatTerakhir = archive.tanggal;
        exists.keterlibatan = peran;
        return;
      }
      newParties.push({
        id: "pt-" + Date.now() + Math.random().toString(36).slice(2, 5),
        nama, nik: nik || "—", status: status || "hidup", keterlibatan: peran,
        riwayatTerakhir: archive.tanggal,
      });
    };
    findOrAdd(form.pengalih.nama, form.pengalih.nik, form.pengalih.status, "pengalih");
    findOrAdd(form.penerima.nama, form.penerima.nik, "hidup", "penerima");

    // update parcel pemilikSaatIni
    const updatedParcels = state.parcels.map((p) =>
      p.id === form.parcelId ? { ...p, pemilikSaatIni: form.penerima.nama, status: "terarsip" } : p
    );

    setState({
      ...state,
      parcels: updatedParcels,
      archives: [archive, ...state.archives],
      parties: [...state.parties, ...newParties],
      audits: [{
        id: "au-" + Date.now(),
        waktu: new Date().toISOString(),
        admin: "operator01", aksi: "CREATE", entitas: "peralihan",
        entId: id, ip: "10.0.12.45",
      }, ...state.audits],
      draft: null,
    });
    toast.success("Arsip SPPHT tersimpan", `${form.nomorSPPHT} berhasil diarsipkan`);
    setTimeout(() => go("detail", form.parcelId), 600);
  };

  return (
    <div data-screen-label="Arsip Baru" className="wizard">
      <div className="stepper">
        <div style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Wizard arsip baru</div>
        {steps.map((s, i) => (
          <div key={i} className={"step " + (i === step ? "active" : i < step ? "done" : "")} onClick={() => i <= step && setStep(i)} style={{ cursor: i <= step ? "pointer" : "default" }}>
            <div className="num">{i < step ? <Icon name="check" size={14} stroke={2.5}/> : i + 1}</div>
            <div style={{ flex: 1 }}>
              <div className="label">{s.label}</div>
              <div className="desc">{s.desc}</div>
            </div>
          </div>
        ))}
        <div className="divider"/>
        <Btn size="sm" variant="ghost" icon="refresh" onClick={resetWizard} style={{ width: "100%", justifyContent: "center" }}>Reset Wizard</Btn>
        {state.draft && (
          <div style={{ marginTop: 10, padding: 10, borderRadius: 8, background: "var(--warning-soft)", fontSize: 11.5, color: "oklch(40% 0.1 78)" }}>
            <b>Draft tersimpan</b><br/>
            <span style={{ opacity: 0.85 }}>{SIADP.relTime(state.draft.savedAt)}</span>
          </div>
        )}
      </div>

      <div>
        {step === 0 && <StepPersil state={state} form={form} setForm={setForm} go={go}/>}
        {step === 1 && <StepPihak state={state} form={form} setForm={setForm} chainIssue={chainIssue}/>}
        {step === 2 && <StepPeralihan form={form} setForm={setForm}/>}
        {step === 3 && <StepDokumen form={form} setForm={setForm}/>}
        {step === 4 && <StepReview state={state} form={form}/>}

        <div style={{ display: "flex", gap: 10, marginTop: 18, alignItems: "center" }}>
          <Btn variant="ghost" icon="chevron-left" onClick={goBack} disabled={step === 0}>Kembali</Btn>
          <div style={{ flex: 1 }}/>
          <Btn variant="subtle" icon="save" onClick={saveDraft}>Simpan Draft</Btn>
          {step < steps.length - 1 ? (
            <Btn variant="primary" onClick={goNext}>Lanjut <Icon name="chevron-right" size={16}/></Btn>
          ) : (
            <Btn variant="primary" icon="check" onClick={simpanArsip} disabled={!docMandatory || !!chainIssue}>Simpan Arsip</Btn>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------------- Step 1: Persil ----------------
function StepPersil({ state, form, setForm, go }) {
  const [q, setQ] = React.useState("");
  const selected = state.parcels.find((p) => p.id === form.parcelId);
  const results = q
    ? state.parcels.filter((p) =>
        [p.kode, p.nop, p.alamat, p.pemilikSaatIni, `${p.rt}/${p.rw}`].join(" ").toLowerCase().includes(q.toLowerCase())
      ).slice(0, 6)
    : [];
  return (
    <div className="card">
      <div className="card-head">
        <div style={{ flex: 1 }}>
          <h3>1. Pilih persil terdaftar</h3>
          <div className="sub">Wizard hanya membuat arsip atas persil yang sudah ada. Persil baru dibuat dari halaman Data Tanah.</div>
        </div>
      </div>
      <div className="card-pad">
        <Field label="Cari persil" hint="Cari berdasar kode persil, NOP, alamat, atau nama pemilik">
          <div className="search-input">
            <Icon name="search" size={16}/>
            <input
              placeholder="Mulai mengetik kode persil atau alamat…"
              value={q}
              onChange={(e) => setQ(e.target.value)}
            />
          </div>
        </Field>
        {q && (
          <div style={{ marginTop: 10, border: "1px solid var(--line)", borderRadius: 10, maxHeight: 240, overflowY: "auto", background: "var(--surface)" }}>
            {results.length === 0 && <div style={{ padding: 14, color: "var(--ink-3)", fontSize: 13 }}>Tidak ada persil yang cocok.</div>}
            {results.map((p) => (
              <div key={p.id}
                onClick={() => { setForm((f) => ({ ...f, parcelId: p.id })); setQ(""); }}
                style={{ padding: "10px 14px", cursor: "pointer", borderBottom: "1px solid var(--line)", display: "flex", gap: 12, alignItems: "center" }}
                onMouseEnter={(e) => e.currentTarget.style.background = "var(--bg-soft)"}
                onMouseLeave={(e) => e.currentTarget.style.background = ""}
              >
                <Icon name="land" size={18}/>
                <div style={{ flex: 1 }}>
                  <div className="mono" style={{ fontSize: 12, fontWeight: 600 }}>{p.kode}</div>
                  <div style={{ fontSize: 12.5, color: "var(--ink-2)" }}>{p.alamat} · RT {p.rt}/{p.rw}</div>
                </div>
                <div style={{ fontSize: 12, color: "var(--ink-3)" }}>{p.pemilikSaatIni}</div>
              </div>
            ))}
          </div>
        )}

        {selected && (
          <div style={{ marginTop: 18, padding: 16, border: "1px solid var(--primary-soft)", background: "var(--primary-soft)", borderRadius: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: "var(--primary)", color: "white", display: "grid", placeItems: "center" }}>
                <Icon name="check" size={18} stroke={2.5}/>
              </div>
              <div style={{ flex: 1 }}>
                <div className="mono" style={{ fontSize: 12, fontWeight: 700, color: "var(--primary-ink)" }}>{selected.kode}</div>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>{selected.alamat}</div>
                <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 2 }}>NOP {selected.nop} · RT {selected.rt}/{selected.rw} · {selected.luas} m²</div>
              </div>
              <StatusBadge status={selected.status}/>
              <Btn size="sm" variant="ghost" icon="x" onClick={() => setForm((f) => ({ ...f, parcelId: "" }))}>Ganti</Btn>
            </div>
            <div className="grid-3" style={{ marginTop: 14, gap: 10 }}>
              <div style={{ padding: 10, background: "white", borderRadius: 8 }}>
                <div style={{ fontSize: 10.5, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Pemilik terakhir</div>
                <div style={{ fontWeight: 600, fontSize: 13, marginTop: 4 }}>{selected.pemilikSaatIni}</div>
              </div>
              <div style={{ padding: 10, background: "white", borderRadius: 8 }}>
                <div style={{ fontSize: 10.5, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Luas tanah</div>
                <div style={{ fontWeight: 600, fontSize: 13, marginTop: 4 }}>{selected.luas} m²</div>
              </div>
              <div style={{ padding: 10, background: "white", borderRadius: 8 }}>
                <div style={{ fontSize: 10.5, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Tanggal pendaftaran</div>
                <div style={{ fontWeight: 600, fontSize: 13, marginTop: 4 }}>{SIADP.formatDate(selected.tanggalDaftar)}</div>
              </div>
            </div>
          </div>
        )}

        {!selected && !q && (
          <div style={{ marginTop: 14, display: "flex", gap: 12, padding: 14, background: "var(--info-soft)", borderRadius: 10 }}>
            <Icon name="info" size={18} stroke={2} className="ico" style={{ color: "var(--info)" }}/>
            <div style={{ fontSize: 12.5, color: "var(--ink-2)" }}>
              Persil baru? <a onClick={() => go("data-tanah")} style={{ color: "var(--primary-ink)", fontWeight: 600, cursor: "pointer", textDecoration: "underline" }}>Daftarkan di Data Tanah</a> terlebih dahulu, lalu kembali ke wizard ini.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------- Step 2: Pihak ----------------
function StepPihak({ state, form, setForm, chainIssue }) {
  const setP = (k, v) => setForm((f) => ({ ...f, pengalih: { ...f.pengalih, [k]: v } }));
  const setR = (k, v) => setForm((f) => ({ ...f, penerima: { ...f.penerima, [k]: v } }));
  return (
    <div className="card">
      <div className="card-head">
        <div style={{ flex: 1 }}>
          <h3>2. Pihak pengalih & penerima</h3>
          <div className="sub">Pengalih harus cocok dengan pemilik terakhir untuk menjaga chain of title.</div>
        </div>
        <label className="check">
          <input type="checkbox" checked={form.rekonstruksi} onChange={(e) => setForm((f) => ({ ...f, rekonstruksi: e.target.checked }))}/>
          Rekonstruksi historis
        </label>
      </div>
      <div className="card-pad">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <div style={{ padding: 16, background: "var(--surface-2)", border: "1px solid var(--line)", borderRadius: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 12 }}>
              <Icon name="user" size={14} stroke={2}/> Pengalih
            </div>
            <div className="col">
              <Field label="Nama pengalih" required>
                <input className="input" placeholder="Nama lengkap" value={form.pengalih.nama} onChange={(e) => setP("nama", e.target.value)}/>
              </Field>
              <Field label="NIK pengalih" hint="16 digit, akan dimask saat ditampilkan">
                <input className="input mono" placeholder="6471010101700001" value={form.pengalih.nik} onChange={(e) => setP("nik", e.target.value.replace(/\D/g, "").slice(0, 16))}/>
              </Field>
              <div className="grid-2">
                <Field label="Status hidup">
                  <select className="select" value={form.pengalih.status} onChange={(e) => setP("status", e.target.value)}>
                    <option value="hidup">Hidup</option>
                    <option value="meninggal">Meninggal</option>
                    <option value="badan hukum">Badan hukum</option>
                  </select>
                </Field>
                <Field label="Peran">
                  <select className="select" value={form.pengalih.peran} onChange={(e) => setP("peran", e.target.value)}>
                    <option value="pemilik">Pemilik</option>
                    <option value="pewaris">Pewaris</option>
                    <option value="ahli waris">Ahli waris</option>
                    <option value="kuasa">Kuasa</option>
                  </select>
                </Field>
              </div>
            </div>
          </div>

          <div style={{ padding: 16, background: "var(--primary-soft)", border: "1px solid transparent", borderRadius: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "var(--primary-ink)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 12 }}>
              <Icon name="user" size={14} stroke={2}/> Penerima
            </div>
            <div className="col">
              <Field label="Nama penerima" required>
                <input className="input" placeholder="Nama lengkap" value={form.penerima.nama} onChange={(e) => setR("nama", e.target.value)}/>
              </Field>
              <Field label="NIK penerima" required>
                <input className="input mono" placeholder="16 digit NIK" value={form.penerima.nik} onChange={(e) => setR("nik", e.target.value.replace(/\D/g, "").slice(0, 16))}/>
              </Field>
              <div className="grid-2">
                <Field label="Jenis kelamin">
                  <select className="select" value={form.penerima.jk} onChange={(e) => setR("jk", e.target.value)}>
                    <option>Laki-laki</option>
                    <option>Perempuan</option>
                  </select>
                </Field>
                <Field label="Nomor telepon">
                  <input className="input" placeholder="08xx-xxxx-xxxx" value={form.penerima.telp} onChange={(e) => setR("telp", e.target.value)}/>
                </Field>
              </div>
              <Field label="Alamat penerima">
                <input className="input" placeholder="Alamat sesuai KTP" value={form.penerima.alamat} onChange={(e) => setR("alamat", e.target.value)}/>
              </Field>
            </div>
          </div>
        </div>

        {chainIssue && (
          <div style={{ marginTop: 14, padding: 14, borderRadius: 10, background: "var(--danger-soft)", border: "1px solid oklch(85% 0.08 27)", display: "flex", gap: 12 }}>
            <Icon name="alert" size={18} stroke={2} style={{ color: "var(--danger)", flex: "none", marginTop: 1 }}/>
            <div style={{ fontSize: 12.5, color: "oklch(38% 0.13 27)" }}>
              <b>Chain of title tidak konsisten.</b> {chainIssue}
            </div>
          </div>
        )}
        {!chainIssue && form.pengalih.nama && (
          <div style={{ marginTop: 14, padding: 12, borderRadius: 10, background: "var(--success-soft)", display: "flex", gap: 10 }}>
            <Icon name="check-circle" size={18} stroke={2} style={{ color: "var(--success)", flex: "none", marginTop: 1 }}/>
            <div style={{ fontSize: 12.5, color: "var(--success)" }}>Chain of title konsisten dengan data master persil.</div>
          </div>
        )}
      </div>
    </div>

}

// ---------------- Step 3: Peralihan ----------------
function StepPeralihan({ form, setForm }) {
  return (
    <div className="card">
      <div className="card-head">
        <div style={{ flex: 1 }}>
          <h3>3. Data peralihan</h3>
          <div className="sub">Tetapkan jenis, tanggal, nomor SPPHT, dan keterangan tambahan.</div>
        </div>
      </div>
      <div className="card-pad">
        <div className="grid-2">
          <Field label="Jenis peralihan" required>
            <select className="select" value={form.jenis} onChange={(e) => setForm((f) => ({ ...f, jenis: e.target.value }))}>
              <option>Jual Beli</option>
              <option>Waris</option>
              <option>Hibah</option>
              <option>Tukar Menukar</option>
              <option>Pelepasan Hak</option>
            </select>
          </Field>
          <Field label="Tanggal peristiwa" required>
            <input className="input" type="date" value={form.tanggal} onChange={(e) => setForm((f) => ({ ...f, tanggal: e.target.value }))}/>
          </Field>
          <Field label="Nomor SPPHT" required hint="Diisi otomatis, bisa diubah">
            <input className="input mono" value={form.nomorSPPHT} onChange={(e) => setForm((f) => ({ ...f, nomorSPPHT: e.target.value, nomorSPPHTTouched: true }))}/>
          </Field>
          <Field label="Nomor akta PPAT" hint="Wajib untuk jual beli, opsional untuk waris">
            <input className="input mono" placeholder="12/2026/PPAT-LKT" value={form.nomorAkta} onChange={(e) => setForm((f) => ({ ...f, nomorAkta: e.target.value }))}/>
          </Field>
        </div>
        <Field label="Catatan tambahan" hint="Konteks atau alasan peralihan (opsional)" style={{ marginTop: 14 }}>
          <textarea className="textarea" rows={3} value={form.catatan} onChange={(e) => setForm((f) => ({ ...f, catatan: e.target.value }))} placeholder="Mis. peralihan antar keluarga, kondisi sengketa sebelumnya, dll."/>
        </Field>
      </div>
    </div>
  );
}

// ---------------- Step 4: Dokumen ----------------
function StepDokumen({ form, setForm }) {
  const toast = useToast();
  const simulateUpload = (key) => {
    setForm((f) => ({ ...f, dokumen: { ...f.dokumen, [key]: { uploaded: false, progress: 0 } } }));
    let p = 0;
    const tick = () => {
      p += 14 + Math.floor(Math.random() * 18);
      if (p >= 100) {
        setForm((f) => ({ ...f, dokumen: { ...f.dokumen, [key]: { uploaded: true, progress: 100 } } }));
        toast.success("Dokumen ter-upload", key);
        return;
      }
      setForm((f) => ({ ...f, dokumen: { ...f.dokumen, [key]: { uploaded: false, progress: p } } }));
      setTimeout(tick, 220);
    };
    setTimeout(tick, 200);
  };

  const removeDoc = (key) => {
    setForm((f) => {
      const next = { ...f.dokumen };
      delete next[key];
      return { ...f, dokumen: next };
    });
  };

  const wajibCount = DOCS_WAJIB.filter((d) => form.dokumen[d.key]?.uploaded).length;
  const wajibTotal = DOCS_WAJIB.length;

  const renderRow = (d) => {
    const st = form.dokumen[d.key];
    const inProgress = st && !st.uploaded && st.progress != null;
    const done = st?.uploaded;
    return (
      <div key={d.key} className={"upload-row " + (done ? "done" : "")}>
        <div className="file-ico"><Icon name={done ? "check" : "file-text"} size={18} stroke={done ? 2.5 : 1.75}/></div>
        <div className="meta">
          <div className="name">{d.key} {d.wajib && <span style={{ color: "var(--danger)" }}>*</span>}</div>
          <div className="sub">
            {done ? `Terverifikasi · scan_${d.key.toLowerCase().replace(/[^a-z0-9]+/g, "_")}.pdf` :
              inProgress ? <span>Mengunggah… {Math.round(st.progress)}%</span> :
              d.wajib ? "Belum diunggah · dokumen wajib" : "Belum diunggah · opsional"}
          </div>
          {inProgress && <div style={{ marginTop: 6 }}><ProgressBar value={st.progress} height={6}/></div>}
        </div>
        {done ? (
          <Btn size="sm" variant="ghost" icon="trash" onClick={() => removeDoc(d.key)}>Hapus</Btn>
        ) : (
          <Btn size="sm" variant={d.wajib ? "primary" : "subtle"} icon="upload" onClick={() => simulateUpload(d.key)} disabled={inProgress}>Upload</Btn>
        )}
      </div>
    );
  };

  return (
    <div className="card">
      <div className="card-head">
        <div style={{ flex: 1 }}>
          <h3>4. Upload dokumen pendukung</h3>
          <div className="sub">Upload bersifat simulasi pada prototype. Status kelengkapan diperbarui otomatis.</div>
        </div>
        <Badge variant={wajibCount === wajibTotal ? "success" : "warning"}>
          {wajibCount}/{wajibTotal} wajib lengkap
        </Badge>
      </div>
      <div className="card-pad">
        <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>Dokumen wajib</div>
        <div>{DOCS_WAJIB.map(renderRow)}</div>
        <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10, marginTop: 22 }}>Dokumen opsional</div>
        <div>{DOCS_OPSIONAL.map(renderRow)}</div>
      </div>
    </div>
  );
}

// ---------------- Step 5: Review ----------------
function StepReview({ state, form }) {
  const p = state.parcels.find((x) => x.id === form.parcelId);
  const dokumenList = Object.keys(form.dokumen).filter((k) => form.dokumen[k]?.uploaded);
  const allMandatory = DOCS_WAJIB.every((d) => form.dokumen[d.key]?.uploaded);
  return (
    <div className="card">
      <div className="card-head">
        <div style={{ flex: 1 }}>
          <h3>5. Review sebelum simpan</h3>
          <div className="sub">Periksa rangkuman di bawah. Tekan <b>Simpan Arsip</b> untuk mengarsipkan SPPHT ini.</div>
        </div>
        <Badge variant={allMandatory ? "success" : "danger"}>
          {allMandatory ? "Siap simpan" : "Dokumen wajib belum lengkap"}
        </Badge>
      </div>
      <div className="card-pad">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <SummaryBox title="Persil">
            <dl className="kv">
              <dt>Kode</dt><dd className="mono">{p?.kode}</dd>
              <dt>NOP</dt><dd className="mono" style={{ fontSize: 12 }}>{p?.nop}</dd>
              <dt>Alamat</dt><dd>{p?.alamat}</dd>
              <dt>RT/RW</dt><dd>{p?.rt}/{p?.rw}</dd>
              <dt>Luas</dt><dd>{p?.luas} m²</dd>
            </dl>
          </SummaryBox>
          <SummaryBox title="Peralihan">
            <dl className="kv">
              <dt>Jenis</dt><dd>{form.jenis}{form.rekonstruksi && <Badge variant="warning" style={{ marginLeft: 6 }}>Rekonstruksi</Badge>}</dd>
              <dt>Tanggal</dt><dd>{SIADP.formatDate(new Date(form.tanggal).toISOString())}</dd>
              <dt>Nomor SPPHT</dt><dd className="mono">{form.nomorSPPHT}</dd>
              <dt>Nomor akta</dt><dd className="mono">{form.nomorAkta || "—"}</dd>
              <dt>Catatan</dt><dd>{form.catatan || "—"}</dd>
            </dl>
          </SummaryBox>
          <SummaryBox title="Pengalih">
            <dl className="kv">
              <dt>Nama</dt><dd>{form.pengalih.nama || "—"}</dd>
              <dt>NIK</dt><dd className="mono">{SIADP.maskNik(form.pengalih.nik)}</dd>
              <dt>Status</dt><dd>{form.pengalih.status}</dd>
              <dt>Peran</dt><dd>{form.pengalih.peran}</dd>
            </dl>
          </SummaryBox>
          <SummaryBox title="Penerima">
            <dl className="kv">
              <dt>Nama</dt><dd>{form.penerima.nama || "—"}</dd>
              <dt>NIK</dt><dd className="mono">{SIADP.maskNik(form.penerima.nik)}</dd>
              <dt>Jenis kelamin</dt><dd>{form.penerima.jk}</dd>
              <dt>Telepon</dt><dd>{form.penerima.telp || "—"}</dd>
              <dt>Alamat</dt><dd>{form.penerima.alamat || "—"}</dd>
            </dl>
          </SummaryBox>
        </div>

        <div style={{ marginTop: 14 }}>
          <SummaryBox title={`Dokumen terunggah (${dokumenList.length})`}>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {dokumenList.length === 0 && <div style={{ color: "var(--ink-3)", fontSize: 12.5 }}>Belum ada dokumen.</div>}
              {dokumenList.map((d) => <Badge key={d} variant="success">{d}</Badge>)}
            </div>
          </SummaryBox>
        </div>
      </div>
    </div>
  );
}

function SummaryBox({ title, children }) {
  return (
    <div style={{ padding: 14, border: "1px solid var(--line)", borderRadius: 12, background: "var(--surface-2)" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>{title}</div>
      {children}
    </div>
  );
}

Object.assign(window, { ArsipBaru });

  </script>
  <script type="text/babel">
// SIADP main app: layout shell + routing
const { useState, useEffect, useMemo, useCallback } = React;

const NAV = [
  { key: "dashboard", label: "Dashboard", icon: "dashboard" },
  { key: "arsip-baru", label: "Arsip Baru", icon: "plus-circle", accent: true },
  { key: "arsip-sppht", label: "Arsip SPPHT", icon: "archive" },
  { key: "data-tanah", label: "Data Tanah", icon: "land" },
  { key: "data-pihak", label: "Data Pihak", icon: "users" },
  { key: "audit-log", label: "Audit Log", icon: "history" },
  { key: "pengaturan", label: "Pengaturan", icon: "settings" },
];

const TITLES = {
  "dashboard": { t: "Dashboard", s: "Ringkasan sistem arsip digital pertanahan." },
  "arsip-baru": { t: "Arsip Baru", s: "Wizard pembuatan arsip SPPHT / peralihan kepemilikan." },
  "arsip-sppht": { t: "Arsip SPPHT", s: "Daftar semua arsip peralihan yang tersimpan." },
  "data-tanah": { t: "Data Tanah", s: "Master data persil di Kelurahan Loktuan." },
  "data-pihak": { t: "Data Pihak", s: "Pengalih, penerima, dan pemilik tercatat." },
  "audit-log": { t: "Audit Log", s: "Jejak audit append-only seluruh aktivitas operator." },
  "pengaturan": { t: "Pengaturan", s: "Akun operator dan informasi sistem." },
  "detail": { t: "Detail Riwayat Kepemilikan", s: "Chain of title persil." },
};

function App() {
  const [state, setState] = useState(() => SIADP.load());
  const [route, setRoute] = useState({ page: "dashboard", ctx: null });

  // persist state on changes
  useEffect(() => { SIADP.save(state); }, [state]);

  // global notification listener for VIEW_FILE audit append
  useEffect(() => {
    window.SIADP._onView = (entId) => {
      setState((s) => ({
        ...s,
        audits: [{
          id: "au-" + Date.now(),
          waktu: new Date().toISOString(),
          admin: "operator01", aksi: "VIEW_FILE", entitas: "dokumen",
          entId, ip: "10.0.12.45",
        }, ...s.audits],
      }));
    };
  }, []);

  const go = useCallback((page, ctx = null) => {
    setRoute({ page, ctx });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  const onReset = () => {
    const fresh = SIADP.resetSimulation();
    setState(fresh);
    setRoute({ page: "dashboard", ctx: null });
  };

  const title = TITLES[route.page] || { t: "—", s: "" };
  const crumbs = route.page === "detail"
    ? ["Beranda", "Data Tanah", "Detail Riwayat"]
    : ["Beranda", title.t];

  return (
    <ToastProvider>
      <div className="app">
        <Sidebar active={route.page} onNav={(k) => go(k)}/>
        <div className="main">
          <Topbar crumbs={crumbs} onArsipBaru={() => go("arsip-baru")}/>
          <div className="content">
            <div className="page-head">
              <div>
                <h1>{title.t}</h1>
                <div className="sub">{title.s}</div>
              </div>
            </div>

            {route.page === "dashboard" && <Dashboard state={state} go={go}/>}
            {route.page === "arsip-baru" && <ArsipBaru state={state} setState={setState} go={go} initialParcelId={route.ctx}/>}
            {route.page === "arsip-sppht" && <ArsipSPPHTList state={state} go={go}/>}
            {route.page === "data-tanah" && <DataTanah state={state} setState={setState} go={go}/>}
            {route.page === "data-pihak" && <DataPihak state={state}/>}
            {route.page === "audit-log" && <AuditLog state={state}/>}
            {route.page === "pengaturan" && <Pengaturan onReset={onReset}/>}
            {route.page === "detail" && <DetailRiwayat state={state} parcelId={route.ctx} go={go}/>}
          </div>
        </div>
      </div>
    </ToastProvider>
  );
}

function Sidebar({ active, onNav }) {
  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <div className="brand-mark">SI</div>
        <div className="brand-text">
          <div className="t1">SIADP Loktuan</div>
          <div className="t2">Arsip Digital Pertanahan</div>
        </div>
      </div>
      <nav className="sidebar-nav">
        <div className="nav-group-label">Operasional</div>
        {NAV.slice(0, 5).map((n) => (
          <button key={n.key} className={"nav-item " + (active === n.key ? "active" : "")} onClick={() => onNav(n.key)}>
            <Icon name={n.icon} size={17}/>
            <span>{n.label}</span>
            {n.accent && active !== n.key && <span className="badge-count" style={{ background: "var(--accent-soft)", color: "oklch(45% 0.1 60)" }}>Cepat</span>}
          </button>
        ))}
        <div className="nav-group-label" style={{ marginTop: 8 }}>Sistem</div>
        {NAV.slice(5).map((n) => (
          <button key={n.key} className={"nav-item " + (active === n.key ? "active" : "")} onClick={() => onNav(n.key)}>
            <Icon name={n.icon} size={17}/>
            <span>{n.label}</span>
          </button>
        ))}
      </nav>
      <div className="sidebar-foot">
        <div className="user">
          <div className="avatar">O1</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-1)" }}>Operator 01</div>
            <div style={{ fontSize: 11, color: "var(--ink-3)" }}>Kel. Loktuan · Admin</div>
          </div>
          <button className="icon-btn" style={{ width: 28, height: 28 }}><Icon name="logout" size={14}/></button>
        </div>
      </div>
    </aside>
  );
}

function Topbar({ crumbs, onArsipBaru }) {
  return (
    <div className="topbar">
      <div className="crumbs">
        {crumbs.map((c, i) => (
          <React.Fragment key={i}>
            {i > 0 && <Icon name="chevron-right" size={12} className="sep"/>}
            <span className={i === crumbs.length - 1 ? "last" : ""}>{c}</span>
          </React.Fragment>
        ))}
      </div>
      <div className="topbar-spacer"/>
      <div className="topbar-search">
        <Icon name="search" size={14}/>
        <input placeholder="Cari cepat di seluruh sistem…"/>
        <span style={{ fontSize: 11, padding: "1px 5px", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 4, color: "var(--ink-4)" }}>⌘K</span>
      </div>
      <Btn variant="primary" icon="plus" onClick={onArsipBaru}>Arsip Baru</Btn>
      <button className="icon-btn" title="Notifikasi"><Icon name="bell" size={16}/><span className="dot"/></button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

  </script>
</body>
</html>
