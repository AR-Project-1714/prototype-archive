<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <meta name="description" content="Prototype satu halaman SIADP Loktuan untuk GitHub Pages.">
  <title>SIADP Loktuan — Prototype Arsip Digital</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
/* SIADP Loktuan — design tokens & base styles */

:root {
  /* warm neutral surfaces */
  --bg: oklch(98% 0.006 85);
  --bg-soft: oklch(96% 0.008 85);
  --surface: oklch(100% 0 0);
  --surface-2: oklch(98.5% 0.005 85);

  /* ink */
  --ink-1: oklch(22% 0.02 200);
  --ink-2: oklch(38% 0.015 200);
  --ink-3: oklch(55% 0.012 200);
  --ink-4: oklch(72% 0.008 200);

  /* borders */
  --line: oklch(91% 0.008 90);
  --line-strong: oklch(85% 0.012 90);

  /* primary teal */
  --primary: oklch(42% 0.07 195);
  --primary-hover: oklch(36% 0.075 195);
  --primary-soft: oklch(94% 0.025 195);
  --primary-ink: oklch(30% 0.07 195);

  /* accents (earth + status) */
  --accent: oklch(62% 0.12 60);   /* amber-tanah */
  --accent-soft: oklch(95% 0.04 75);

  --success: oklch(50% 0.11 155);
  --success-soft: oklch(95% 0.04 155);
  --warning: oklch(62% 0.13 78);
  --warning-soft: oklch(95% 0.05 85);
  --danger: oklch(54% 0.17 27);
  --danger-soft: oklch(96% 0.03 27);
  --info: oklch(52% 0.11 240);
  --info-soft: oklch(95% 0.03 240);

  /* radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  /* shadows */
  --shadow-sm: 0 1px 2px oklch(20% 0.02 200 / 0.04), 0 1px 1px oklch(20% 0.02 200 / 0.03);
  --shadow-md: 0 4px 12px oklch(20% 0.02 200 / 0.06), 0 1px 3px oklch(20% 0.02 200 / 0.04);
  --shadow-lg: 0 16px 40px oklch(20% 0.02 200 / 0.14), 0 4px 12px oklch(20% 0.02 200 / 0.06);

  /* type */
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar-brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: center;
}
.brand-mark {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--primary);
  color: white;
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.02em;
  box-shadow: inset 0 -2px 0 oklch(30% 0.07 195);
}
.brand-text { line-height: 1.15; }
.brand-text .t1 { font-weight: 700; font-size: 15px; color: var(--ink-1); }
.brand-text .t2 { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

.sidebar-nav {
  padding: 14px 12px;
  flex: 1;
  overflow-y: auto;
}
.nav-group-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-4);
  padding: 10px 12px 6px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  transition: background 120ms, color 120ms;
}
.nav-item:hover { background: var(--bg-soft); color: var(--ink-1); }
.nav-item.active {
  background: var(--primary-soft);
  color: var(--primary-ink);
  font-weight: 600;
}
.nav-item .ico { width: 18px; height: 18px; opacity: 0.85; flex: none; }
.nav-item.active .ico { opacity: 1; }
.nav-item .badge-count {
  margin-left: auto;
  font-size: 11px;
  background: var(--bg-soft);
  color: var(--ink-3);
  padding: 1px 7px;
  border-radius: 999px;
  font-weight: 600;
}
.nav-item.active .badge-count { background: var(--primary); color: white; }

.sidebar-foot {
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--ink-3);
}
.sidebar-foot .user {
  display: flex; gap: 10px; align-items: center;
  padding: 8px;
  border-radius: 10px;
  background: var(--bg-soft);
}
.sidebar-foot .avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: grid; place-items: center;
  font-size: 12px;
  font-weight: 700;
}

/* ---------- Main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 60px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 28px;
  position: sticky; top: 0;
  z-index: 30;
}
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; }
.crumbs .sep { color: var(--ink-4); }
.crumbs .last { color: var(--ink-1); font-weight: 600; }
.topbar-spacer { flex: 1; }
.topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  padding: 7px 12px;
  border-radius: 8px;
  width: 280px;
  color: var(--ink-3);
  font-size: 13px;
}
.topbar-search input { background: transparent; border: 0; outline: none; flex: 1; }

.icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid; place-items: center;
  color: var(--ink-2);
  position: relative;
}
.icon-btn:hover { background: var(--bg-soft); }
.icon-btn .dot {
  position: absolute; top: 7px; right: 7px;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  border: 2px solid var(--surface);
}

.content {
  padding: 28px;
  flex: 1;
  min-width: 0;
}
.page-head {
  display: flex; align-items: flex-end; gap: 16px;
  margin-bottom: 22px;
}
.page-head h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.page-head .sub {
  color: var(--ink-3);
  font-size: 13.5px;
  margin-top: 4px;
}
.page-head-actions {
  margin-left: auto;
  display: flex; gap: 10px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid transparent;
  background: var(--surface);
  color: var(--ink-1);
  transition: background 120ms, border-color 120ms, transform 80ms;
}
.btn:active { transform: translateY(1px); }
.btn .ico { width: 16px; height: 16px; }

.btn.primary {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line); }
.btn.ghost:hover { background: var(--bg-soft); color: var(--ink-1); }

.btn.subtle { background: var(--bg-soft); color: var(--ink-2); }
.btn.subtle:hover { background: var(--line); color: var(--ink-1); }

.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger:hover { background: oklch(92% 0.06 27); }

.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; font-size: 12px; }

/* ---------- Card / surface ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.card-pad { padding: 22px; }
.card-head {
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.card-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
.card-head .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }

/* ---------- Badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  background: var(--bg-soft);
  color: var(--ink-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge.success { background: var(--success-soft); color: var(--success); border-color: transparent; }
.badge.warning { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
.badge.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge.primary { background: var(--primary-soft); color: var(--primary-ink); border-color: transparent; }
.badge.muted { background: var(--bg-soft); color: var(--ink-3); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; }
table.data {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}
.data thead th {
  text-align: left;
  font-weight: 600;
  color: var(--ink-3);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 11px 16px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0;
}
.data tbody td {
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.data tbody tr:last-child td { border-bottom: 0; }
.data tbody tr:hover { background: var(--bg-soft); }
.data .mono { font-family: var(--font-mono); font-size: 12px; }
.data .col-actions { text-align: right; }
.data .empty {
  padding: 56px 24px;
  text-align: center;
  color: var(--ink-3);
}
.data .empty .big {
  width: 56px; height: 56px;
  margin: 0 auto 12px;
  background: var(--bg-soft);
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--ink-4);
}

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.field > label .req { color: var(--danger); margin-left: 2px; }
.field .hint { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.field .error { font-size: 11.5px; color: var(--danger); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.field .ok { font-size: 11.5px; color: var(--success); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.input, .select, .textarea {
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13.5px;
  color: var(--ink-1);
  width: 100%;
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.input:hover, .select:hover, .textarea:hover { border-color: oklch(75% 0.012 90); }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px oklch(42% 0.07 195 / 0.12);
}
.input.error, .select.error, .textarea.error { border-color: var(--danger); }
.input.error:focus { box-shadow: 0 0 0 3px oklch(54% 0.17 27 / 0.15); }
.textarea { resize: vertical; min-height: 80px; }
.input::placeholder { color: var(--ink-4); }

.search-input {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 0 12px;
  transition: border-color 120ms, box-shadow 120ms;
}
.search-input:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px oklch(42% 0.07 195 / 0.12);
}
.search-input input {
  flex: 1;
  border: 0;
  background: transparent;
  outline: none;
  padding: 9px 0;
  font-size: 13.5px;
}
.search-input .ico { color: var(--ink-3); width: 16px; height: 16px; }

/* ---------- Toast ---------- */
.toast-stack {
  position: fixed;
  right: 24px;
  bottom: 24px;
  display: flex; flex-direction: column;
  gap: 10px;
  z-index: 200;
  max-width: 360px;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--primary);
  border-radius: 10px;
  padding: 12px 14px 12px 14px;
  box-shadow: var(--shadow-md);
  display: flex; gap: 10px; align-items: flex-start;
  animation: toast-in 220ms ease-out;
}
.toast.success { border-left-color: var(--success); }
.toast.warning { border-left-color: var(--warning); }
.toast.danger { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--info); }
.toast .ico { flex: none; }
.toast .body .t { font-size: 13px; font-weight: 600; color: var(--ink-1); }
.toast .body .s { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: oklch(20% 0.02 200 / 0.42);
  backdrop-filter: blur(2px);
  display: grid; place-items: center;
  z-index: 100;
  padding: 24px;
  animation: fade-in 160ms ease-out;
}
.modal-card {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 720px;
  max-height: calc(100vh - 48px);
  display: flex; flex-direction: column;
  animation: modal-in 220ms cubic-bezier(.2,.7,.3,1);
}
.modal-card.lg { max-width: 920px; }
.modal-card.sm { max-width: 480px; }
.modal-head {
  padding: 18px 22px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.modal-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.modal-head .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-foot {
  padding: 14px 22px;
  border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: flex-end;
  background: var(--bg-soft);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(8px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---------- Grid helpers ---------- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.gap-sm { gap: 6px; }
.gap-md { gap: 14px; }
.gap-lg { gap: 22px; }
.spacer { flex: 1; }
.mono { font-family: var(--font-mono); }

/* ---------- Stat cards ---------- */
.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
}
.stat .label { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.stat .value { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
.stat .delta { font-size: 11.5px; color: var(--success); margin-top: 4px; font-weight: 600; }
.stat .delta.neg { color: var(--danger); }
.stat .ico-wrap {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--primary-soft);
  color: var(--primary-ink);
  display: grid; place-items: center;
  margin-bottom: 10px;
}
.stat .ico-wrap.amber { background: var(--accent-soft); color: oklch(45% 0.1 60); }
.stat .ico-wrap.green { background: var(--success-soft); color: var(--success); }
.stat .ico-wrap.blue  { background: var(--info-soft); color: var(--info); }

/* ---------- Hero panel (dashboard) ---------- */
.hero {
  background: var(--primary);
  color: white;
  border-radius: var(--r-xl);
  padding: 28px 30px;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 28px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  right: -80px; top: -80px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: oklch(48% 0.07 195);
  opacity: 0.6;
}
.hero::after {
  content: "";
  position: absolute;
  right: 60px; bottom: -50px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: oklch(52% 0.07 195);
  opacity: 0.5;
}
.hero > * { position: relative; z-index: 1; }
.hero h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.hero p { margin: 8px 0 18px; opacity: 0.85; font-size: 14px; max-width: 50ch; }
.hero .cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .btn { backdrop-filter: blur(8px); }
.hero .btn.primary { background: white; color: var(--primary-ink); border-color: white; }
.hero .btn.primary:hover { background: oklch(96% 0.005 195); }
.hero .btn.ghost { background: oklch(100% 0 0 / 0.1); color: white; border-color: oklch(100% 0 0 / 0.25); }
.hero .btn.ghost:hover { background: oklch(100% 0 0 / 0.18); }
.hero .completeness {
  background: oklch(100% 0 0 / 0.1);
  border: 1px solid oklch(100% 0 0 / 0.18);
  border-radius: 14px;
  padding: 18px 18px;
  align-self: center;
}
.hero .completeness .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; }
.hero .completeness .pct { font-size: 36px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
.hero .completeness .bar { height: 8px; background: oklch(100% 0 0 / 0.18); border-radius: 999px; overflow: hidden; margin-top: 12px; }
.hero .completeness .bar > div { height: 100%; background: white; border-radius: 999px; transition: width 480ms ease; }
.hero .completeness .sub { font-size: 12px; opacity: 0.85; margin-top: 10px; }

/* ---------- Wizard ---------- */
.wizard {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 22px;
  align-items: start;
}
.stepper {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px 18px;
  position: sticky; top: 88px;
}
.step {
  display: flex; gap: 14px;
  align-items: flex-start;
  padding: 10px 0;
  position: relative;
}
.step + .step::before {
  content: "";
  position: absolute;
  left: 14px; top: -14px;
  width: 2px; height: 24px;
  background: var(--line);
}
.step.done + .step::before { background: var(--success); }
.step .num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-soft);
  color: var(--ink-3);
  display: grid; place-items: center;
  font-size: 12px;
  font-weight: 700;
  flex: none;
  border: 1px solid var(--line);
}
.step.active .num { background: var(--primary); color: white; border-color: var(--primary); }
.step.done .num { background: var(--success); color: white; border-color: var(--success); }
.step .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.step.active .label { color: var(--ink-1); }
.step .desc { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* ---------- Timeline ---------- */
.timeline { position: relative; padding-left: 26px; }
.timeline::before {
  content: "";
  position: absolute;
  left: 9px; top: 4px; bottom: 4px;
  width: 2px;
  background: var(--line);
}
.tl-item { position: relative; padding-bottom: 22px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: "";
  position: absolute;
  left: -22px; top: 6px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--primary);
}

    if (!iso) return "—";

  }
  function formatDateTime(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function relTime(iso) {
    const now = Date.now();
    const t = new Date(iso).getTime();
    const diff = Math.max(0, now - t) / 1000;
    if (diff < 60) return "baru saja";
    if (diff < 3600) return Math.floor(diff / 60) + " menit lalu";
    if (diff < 86400) return Math.floor(diff / 3600) + " jam lalu";
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + " hari lalu";
    return formatDate(iso);
  }

  function nextParcelKode(parcels, rt, rw) {
    const year = new Date().getFullYear();
    const prefix = `LKT-${rt}-${rw}-${year}-`;
    const existing = parcels.filter((p) => p.kode.startsWith(prefix));
    const max = existing.reduce((m, p) => {
      const n = parseInt(p.kode.slice(prefix.length), 10);
      return isNaN(n) ? m : Math.max(m, n);
    }, 0);
    return prefix + String(max + 1).padStart(3, "0");
  }

    maskNik, formatDate, formatDateTime, relTime, nextParcelKode,

// ---------------- Button ----------------
function Btn({ children, variant = "default", icon, size, ...rest }) {
  const cls = ["btn", variant !== "default" && variant, size === "sm" && "sm"].filter(Boolean).join(" ");
  return <button className={cls} {...rest}>{icon && <Icon name={icon} size={size === "sm" ? 14 : 16} />}{children}</button>;
}

// ---------------- Badge ----------------
function Badge({ children, variant = "" }) {
  return <span className={"badge " + variant}><span className="dot"/>{children}</span>;
}
function StatusBadge({ status }) {
  const map = {
    terarsip: { v: "success", t: "Terarsip" },
    draft: { v: "warning", t: "Draft" },
    sengketa: { v: "danger", t: "Sengketa" },
    hidup: { v: "success", t: "Hidup" },
    meninggal: { v: "muted", t: "Meninggal" },
    "badan hukum": { v: "info", t: "Badan Hukum" },
  };
  const c = map[status] || { v: "muted", t: status };
  return <Badge variant={c.v}>{c.t}</Badge>;
}

// ---------------- Field wrapper ----------------
function Field({ label, required, error, hint, ok, children }) {
  return (
    <div className="field">
      {label && <label>{label}{required && <span className="req">*</span>}</label>}
      {children}
      {error && <div className="error"><Icon name="alert" size={12} stroke={2.2}/>{error}</div>}
      {ok && <div className="ok"><Icon name="check" size={12} stroke={2.2}/>{ok}</div>}
      {hint && !error && !ok && <div className="hint">{hint}</div>}
    </div>
  );
}

// ---------------- Modal ----------------
function Modal({ open, onClose, title, subtitle, children, footer, size = "" }) {
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") onClose && onClose(); };
    window.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose && onClose(); }}>
      <div className={"modal-card " + size}>
        <div className="modal-head">
          <div style={{ flex: 1 }}>
            <h2>{title}</h2>
            {subtitle && <div className="sub">{subtitle}</div>}
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="Tutup" style={{ width: 32, height: 32 }}>
            <Icon name="x" size={16}/>
          </button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

// ---------------- Toast ----------------
const ToastCtx = React.createContext(null);
function ToastProvider({ children }) {
  const [items, setItems] = React.useState([]);
  const push = React.useCallback((t) => {
    const id = Math.random().toString(36).slice(2);
    setItems((arr) => [...arr, { id, ...t }]);
    setTimeout(() => setItems((arr) => arr.filter((x) => x.id !== id)), t.duration || 3200);
  }, []);
  const api = React.useMemo(() => ({
    success: (t, s) => push({ variant: "success", title: t, sub: s }),
    info: (t, s) => push({ variant: "info", title: t, sub: s }),
    warn: (t, s) => push({ variant: "warning", title: t, sub: s }),
    error: (t, s) => push({ variant: "danger", title: t, sub: s }),
  }), [push]);
  return (
    <ToastCtx.Provider value={api}>
      {children}
      <div className="toast-stack">
        {items.map((t) => (
          <div key={t.id} className={"toast " + t.variant}>
            <div className="ico" style={{ marginTop: 1 }}>
              <Icon name={t.variant === "success" ? "check-circle" : t.variant === "danger" ? "alert" : "info"} size={18} stroke={2}/>
            </div>
            <div className="body">
              <div className="t">{t.title}</div>
              {t.sub && <div className="s">{t.sub}</div>}
            </div>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => React.useContext(ToastCtx);

// ---------------- Pagination ----------------
function Pagination({ page, pageSize, total, onPage }) {
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const from = total === 0 ? 0 : (page - 1) * pageSize + 1;
  const to = Math.min(total, page * pageSize);
  const window2 = [];
  for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) window2.push(i);
  return (
    <div className="pagi">
      <div className="info">Menampilkan <b>{from}–{to}</b> dari <b>{total}</b> arsip</div>
      <div className="pages">
        <button className="page-btn" disabled={page <= 1} onClick={() => onPage(page - 1)}>Sebelumnya</button>
        {window2[0] > 1 && <span style={{ alignSelf: "center", color: "var(--ink-4)" }}>…</span>}
        {window2.map((p) => (
          <button key={p} className={"page-btn" + (p === page ? " active" : "")} onClick={() => onPage(p)}>{p}</button>
        ))}
        {window2[window2.length - 1] < totalPages && <span style={{ alignSelf: "center", color: "var(--ink-4)" }}>…</span>}
        <button className="page-btn" disabled={page >= totalPages} onClick={() => onPage(page + 1)}>Berikutnya</button>
      </div>
    </div>
  );
}

// ---------------- ProgressBar ----------------
function ProgressBar({ value, max = 100, color = "var(--primary)", height = 8 }) {
  const pct = Math.min(100, Math.max(0, (value / max) * 100));
  return (
    <div style={{ background: "var(--bg-soft)", borderRadius: 999, overflow: "hidden", height, border: "1px solid var(--line)" }}>
      <div style={{ width: pct + "%", height: "100%", background: color, transition: "width 320ms ease" }}/>
    </div>
  );
}

// ---------------- Empty state row for tables ----------------
function EmptyRow({ cols, icon = "search", title = "Belum ada data", sub }) {
  return (
    <tr>
      <td colSpan={cols} className="empty">
        <div className="empty">
          <div className="big"><Icon name={icon} size={24}/></div>
          <div style={{ fontWeight: 600, color: "var(--ink-1)" }}>{title}</div>
          {sub && <div style={{ marginTop: 4 }}>{sub}</div>}
        </div>
      </td>
    </tr>
  );
}

// Expose
Object.assign(window, {
  Icon, Btn, Badge, StatusBadge, Field, Modal,
  ToastProvider, useToast, Pagination, ProgressBar, EmptyRow,
});

function ArsipSPPHTList({ state, go }) {
  const [q, setQ] = useState("");
  const [committedQ, setCommittedQ] = useState("");
  const [rt, setRt] = useState("");
  const [rw, setRw] = useState("");
  const [jenis, setJenis] = useState("");
  const [status, setStatus] = useState("");
  const [page, setPage] = useState(1);
  const pageSize = 8;
  const toast = useToast();

  const rtsRws = useMemo(() => {
    const rts = [...new Set(state.parcels.map((p) => p.rt))].sort();
    const rws = [...new Set(state.parcels.map((p) => p.rw))].sort();
    return { rts, rws };
  }, [state.parcels]);

  const filtered = useMemo(() => {
    const lq = committedQ.trim().toLowerCase();
    return state.archives.filter((a) => {
      const p = state.parcels.find((x) => x.id === a.parcelId);
      if (!p) return false;
      if (rt && p.rt !== rt) return false;
      if (rw && p.rw !== rw) return false;
      if (jenis && a.jenis !== jenis) return false;
      if (status && a.status !== status) return false;
      if (!lq) return true;
      const hay = [
        a.pengalih?.nik, a.penerima?.nik,
        p.kode, p.nop, a.nomorSPPHT,
        p.pemilikSaatIni, a.pengalih?.nama, a.penerima?.nama,
        p.alamat, `${p.rt}/${p.rw}`, a.jenis,
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(lq);
    }).sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
  }, [state, committedQ, rt, rw, jenis, status]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageData = filtered.slice((page - 1) * pageSize, page * pageSize);

  useEffect(() => { if (page > totalPages) setPage(1); }, [totalPages]);

  const commitSearch = () => {
    setCommittedQ(q);
    setPage(1);
    toast.info("Pencarian diperbarui", q ? `Kata kunci: "${q}"` : "Semua arsip ditampilkan");
  };
  const applyFilter = () => {
    setPage(1);
    toast.info("Filter diterapkan", "Hasil tabel sudah disesuaikan");
  };

  return (
    <div data-screen-label="Arsip SPPHT">
      <div className="card">
        <div className="card-head">
          <div style={{ flex: 1 }}>
            <h3>Daftar Arsip SPPHT / Peralihan</h3>
            <div className="sub">Cari berdasar NIK, nomor persil, NOP, nomor SPPHT, nama, atau alamat.</div>
          </div>
          <Btn variant="primary" icon="plus" onClick={() => go("arsip-baru")}>Arsip Baru</Btn>
        </div>

        <div className="filter-bar">
          <Field label="Kata kunci">
            <div className="search-input" style={{ width: 360 }}>
              <Icon name="search" size={16}/>
              <input
                placeholder="NIK / Nomor SPPHT / NOP / Nama / Alamat…"
                value={q}
                onChange={(e) => setQ(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") commitSearch(); }}
              />
              {q && <button className="icon-btn" style={{ width: 22, height: 22, border: 0, background: "transparent" }} onClick={() => { setQ(""); setCommittedQ(""); }}>
                <Icon name="x" size={14}/>
              </button>}
            </div>
          </Field>
          <Field label="RT">
            <select className="select" style={{ width: 100 }} value={rt} onChange={(e) => setRt(e.target.value)}>
              <option value="">Semua</option>
              {rtsRws.rts.map((r) => <option key={r} value={r}>{r}</option>)}
            </select>
          </Field>
          <Field label="RW">
            <select className="select" style={{ width: 100 }} value={rw} onChange={(e) => setRw(e.target.value)}>
              <option value="">Semua</option>
              {rtsRws.rws.map((r) => <option key={r} value={r}>{r}</option>)}
            </select>
          </Field>
          <Field label="Jenis peralihan">
            <select className="select" style={{ width: 160 }} value={jenis} onChange={(e) => setJenis(e.target.value)}>
              <option value="">Semua</option>
              <option>Jual Beli</option>
              <option>Waris</option>
              <option>Hibah</option>
              <option>Tukar Menukar</option>
              <option>Pelepasan Hak</option>
            </select>
          </Field>
          <Field label="Status">
            <select className="select" style={{ width: 140 }} value={status} onChange={(e) => setStatus(e.target.value)}>
              <option value="">Semua</option>
              <option value="terarsip">Terarsip</option>
              <option value="draft">Draft</option>
              <option value="sengketa">Sengketa</option>
            </select>
          </Field>
          <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}>
            <Btn variant="ghost" icon="refresh" onClick={() => { setQ(""); setCommittedQ(""); setRt(""); setRw(""); setJenis(""); setStatus(""); setPage(1); }}>Reset</Btn>
            <Btn variant="subtle" icon="search" onClick={commitSearch}>Cari</Btn>
            <Btn variant="primary" icon="filter" onClick={applyFilter}>Terapkan</Btn>
          </div>
        </div>

        <div className="table-wrap">
          <table className="data">
            <thead>
              <tr>
                <th>Kode persil</th>
                <th>Lokasi</th>
                <th>Pemilik</th>
                <th>Jenis</th>
                <th>Nomor SPPHT</th>
                <th>Tanggal</th>
                <th>Status</th>
                <th className="col-actions">Aksi</th>
              </tr>
            </thead>
            <tbody>
              {pageData.length === 0 && <EmptyRow cols={8} title="Tidak ada arsip yang cocok" sub="Coba ubah kata kunci atau atur ulang filter."/>}
              {pageData.map((a) => {
                const p = state.parcels.find((x) => x.id === a.parcelId);
                return (
                  <tr key={a.id}>
                    <td className="mono">{p?.kode}</td>
                    <td>
                      <div>{p?.alamat}</div>
                      <div style={{ color: "var(--ink-3)", fontSize: 11.5 }}>RT {p?.rt}/RW {p?.rw}</div>
                    </td>
                    <td>{p?.pemilikSaatIni}</td>
                    <td><Badge variant={a.jenis === "Waris" ? "info" : a.jenis === "Hibah" ? "warning" : "primary"}>{a.jenis}</Badge></td>
                    <td className="mono">{a.nomorSPPHT}</td>
                    <td>{SIADP.formatDate(a.tanggal)}</td>
                    <td><StatusBadge status={a.status}/></td>
                    <td className="col-actions">
                      <Btn size="sm" variant="subtle" icon="open" onClick={() => go("detail", a.parcelId)}>Detail</Btn>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <Pagination page={page} pageSize={pageSize} total={filtered.length} onPage={setPage}/>
      </div>
    </div>
  );
}

// ---------------------------------- DATA TANAH ----------------------------------
function DataTanah({ state, setState, go }) {
  const [q, setQ] = useState("");
  const [committedQ, setCommittedQ] = useState("");
  const [openAdd, setOpenAdd] = useState(false);
  const [showFilter, setShowFilter] = useState(false);
  const [fStatus, setFStatus] = useState("");
  const [fRT, setFRT] = useState("");
  const toast = useToast();

  const filtered = useMemo(() => {
    const lq = committedQ.trim().toLowerCase();
    return state.parcels.filter((p) => {
      if (fStatus && p.status !== fStatus) return false;
      if (fRT && p.rt !== fRT) return false;
      if (!lq) return true;
      // search ONLY by pemilik (pemilikSaatIni + pemilikAwal) and alamat
      const hay = [p.pemilikSaatIni, p.pemilikAwal, p.alamat].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(lq);
    });
  }, [state.parcels, committedQ, fStatus, fRT]);

  return (
    <div data-screen-label="Data Tanah">
      <div className="card">
        <div className="card-head">
          <div style={{ flex: 1 }}>
            <h3>Master Data Tanah / Persil</h3>
            <div className="sub">Pencarian hanya berdasarkan nama pemilik atau alamat lokasi.</div>
          </div>
          <Btn variant="ghost" icon="filter" onClick={() => setShowFilter((v) => !v)}>Filter</Btn>
          <Btn variant="primary" icon="plus" onClick={() => setOpenAdd(true)}>Tambah Persil</Btn>
        </div>

        <div className="filter-bar">
          <Field label="Cari nama pemilik / alamat">
            <div className="search-input" style={{ width: 420 }}>
              <Icon name="search" size={16}/>
              <input
                placeholder="Contoh: Siti Aminah, Jl. Mayjend Sutoyo…"
                value={q}
                onChange={(e) => setQ(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    setCommittedQ(q);
                    toast.info("Daftar diperbarui", q ? `Kata kunci: "${q}"` : "Semua persil ditampilkan");
                  }
                }}
              />
            </div>
          </Field>
          {showFilter && (
            <>
              <Field label="Status">
                <select className="select" style={{ width: 140 }} value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
                  <option value="">Semua</option>
                  <option value="terarsip">Terarsip</option>
                  <option value="draft">Draft</option>
                  <option value="sengketa">Sengketa</option>
                </select>
              </Field>
              <Field label="RT">
                <select className="select" style={{ width: 100 }} value={fRT} onChange={(e) => setFRT(e.target.value)}>
                  <option value="">Semua</option>
                  {[...new Set(state.parcels.map((p) => p.rt))].sort().map((r) => <option key={r}>{r}</option>)}
                </select>
              </Field>
            </>
          )}
          <div style={{ marginLeft: "auto", color: "var(--ink-3)", fontSize: 12 }}>
            Menampilkan <b style={{ color: "var(--ink-1)" }}>{filtered.length}</b> dari <b style={{ color: "var(--ink-1)" }}>{state.parcels.length}</b> persil
          </div>
        </div>

        <div className="table-wrap">
          <table className="data">
            <thead>
              <tr>
                <th>Kode persil</th>
                <th>NOP PBB</th>
                <th>RT/RW</th>
                <th>Lokasi</th>
                <th>Luas</th>
                <th>Pemilik saat ini</th>
                <th>Status</th>
                <th className="col-actions">Aksi</th>
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 && <EmptyRow cols={8} icon="land" title="Persil tidak ditemukan" sub="Coba kata kunci nama pemilik atau alamat yang lain."/>}
              {filtered.map((p) => (
                <tr key={p.id}>
                  <td className="mono">{p.kode}</td>
                  <td className="mono" style={{ fontSize: 11.5 }}>{p.nop}</td>
                  <td>RT {p.rt}/{p.rw}</td>
                  <td>{p.alamat}</td>
                  <td><span style={{ fontWeight: 600 }}>{p.luas}</span> <span style={{ color: "var(--ink-3)" }}>m²</span></td>
                  <td>{p.pemilikSaatIni}</td>
                  <td><StatusBadge status={p.status}/></td>
                  <td className="col-actions">
                    <Btn size="sm" variant="subtle" icon="open" onClick={() => go("detail", p.id)}>Buka</Btn>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <TambahPersilModal
        open={openAdd}
        onClose={() => setOpenAdd(false)}
        state={state}
        onSave={(parcel) => {
          const next = {
            ...state,
            parcels: [...state.parcels, parcel],
            audits: [{
              id: "au-" + Date.now(),
              waktu: new Date().toISOString(),
              admin: "operator01", aksi: "CREATE", entitas: "tanah",
              entId: parcel.id, ip: "10.0.12.45",
            }, ...state.audits],
          };
          setState(next);
          setOpenAdd(false);
          toast.success("Persil tersimpan", `${parcel.kode} ditambahkan ke Data Tanah`);
        }}
      />
    </div>
  );
}

// ---------------------------------- Tambah Persil Modal ----------------------------------
function TambahPersilModal({ open, onClose, state, onSave }) {
  const empty = { rt: "", rw: "", kode: "", nop: "", alamat: "", luas: "", pemilikSaatIni: "", status: "terarsip", tanggalDaftar: new Date().toISOString().slice(0, 10), batas: { utara: "", selatan: "", timur: "", barat: "" } };
  const [form, setForm] = useState(empty);
  const [errors, setErrors] = useState({});
  const toast = useToast();

  // auto-generate kode when rt+rw set
  useEffect(() => {
    if (!open) return;
    if (form.rt && form.rw && !form.kodeTouched) {
      const next = SIADP.nextParcelKode(state.parcels, form.rt, form.rw);
      setForm((f) => ({ ...f, kode: next }));
    }
  }, [form.rt, form.rw, open]);

  useEffect(() => {
    if (open) { setForm(empty); setErrors({}); }
  }, [open]);

  const codeStatus = useMemo(() => {
    if (!form.kode) return null;
    const exists = state.parcels.some((p) => p.kode === form.kode);
    return exists ? { ok: false, msg: "Kode sudah ada — gunakan nomor lain" } : { ok: true, msg: "Kode tersedia" };
  }, [form.kode, state.parcels]);

  const change = (k, v) => setForm((f) => ({ ...f, [k]: v, ...(k === "kode" ? { kodeTouched: true } : {}) }));
  const changeBatas = (k, v) => setForm((f) => ({ ...f, batas: { ...f.batas, [k]: v } }));

  const submit = () => {
    const e = {};
    if (!form.rt) e.rt = "RT wajib diisi";
    if (!form.rw) e.rw = "RW wajib diisi";
    if (!form.alamat) e.alamat = "Alamat wajib diisi";
    if (!form.luas) e.luas = "Luas wajib diisi";
    if (!form.pemilikSaatIni) e.pemilikSaatIni = "Pemilik wajib diisi";
    if (!form.kode) e.kode = "Kode persil wajib diisi";
    if (codeStatus && !codeStatus.ok) e.kode = "Kode sudah ada";
    setErrors(e);
    if (Object.keys(e).length > 0) {
      toast.error("Data wajib belum lengkap", "Periksa kembali field yang ditandai");
      return;
    }
    onSave({
      id: "p-" + Date.now(),
      kode: form.kode,
      nop: form.nop || "—",
      rt: form.rt, rw: form.rw,
      alamat: form.alamat,
      luas: parseInt(form.luas, 10) || 0,
      pemilikAwal: form.pemilikSaatIni,
      pemilikSaatIni: form.pemilikSaatIni,
      status: form.status,
      tanggalDaftar: new Date(form.tanggalDaftar).toISOString(),
      batas: form.batas,
    });
  };

  return (
    <Modal
      open={open}
      onClose={onClose}
      title="Tambah Persil Baru"
      subtitle="Isi data master tanah. Persil baru bisa langsung dipilih di Arsip Baru setelah disimpan."
      footer={<>
        <Btn variant="ghost" onClick={onClose}>Batal</Btn>
        <Btn variant="primary" icon="save" onClick={submit}>Simpan Persil</Btn>
      </>}
    >
      <div style={{ display: "grid", gap: 18 }}>
        <div>
          <div style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 10 }}>Lokasi administratif</div>
          <div className="grid-3">
            <Field label="RT" required error={errors.rt}>
              <input className={"input" + (errors.rt ? " error" : "")} placeholder="04" value={form.rt} onChange={(e) => change("rt", e.target.value.padStart(2, "0").slice(0, 2))}/>
            </Field>
            <Field label="RW" required error={errors.rw}>
              <input className={"input" + (errors.rw ? " error" : "")} placeholder="02" value={form.rw} onChange={(e) => change("rw", e.target.value.padStart(2, "0").slice(0, 2))}/>
            </Field>
            <Field label="Tanggal pendaftaran" required>
              <input className="input" type="date" value={form.tanggalDaftar} onChange={(e) => change("tanggalDaftar", e.target.value)}/>
            </Field>
          </div>
        </div>

        <div>
          <div style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 10 }}>Identitas persil</div>
          <div className="grid-2">
            <Field
              label="Kode persil"
              required
              error={errors.kode}
              ok={codeStatus?.ok ? codeStatus.msg : null}
              hint={!form.kode ? "Format: LKT-RT-RW-TAHUN-NOURUT (otomatis)" : null}
            >
              <input
                className={"input mono" + (errors.kode || (codeStatus && !codeStatus.ok) ? " error" : "")}
                placeholder="LKT-04-02-2026-001"
                value={form.kode}
                onChange={(e) => change("kode", e.target.value.toUpperCase())}
              />
            </Field>
            <Field label="NOP PBB" hint="Optional saat pendaftaran awal">
              <input className="input mono" placeholder="65.71.030.012.001-0000.0" value={form.nop} onChange={(e) => change("nop", e.target.value)}/>
            </Field>
          </div>
          <div className="grid-2" style={{ marginTop: 14 }}>
            <Field label="Alamat lokasi" required error={errors.alamat}>
              <input className={"input" + (errors.alamat ? " error" : "")} placeholder="Jl. Mayjend Sutoyo Gg. Melati No. ?" value={form.alamat} onChange={(e) => change("alamat", e.target.value)}/>
            </Field>
            <Field label="Luas tanah (m²)" required error={errors.luas}>
              <input className={"input" + (errors.luas ? " error" : "")} type="number" placeholder="240" value={form.luas} onChange={(e) => change("luas", e.target.value)}/>
            </Field>
          </div>
          <div className="grid-2" style={{ marginTop: 14 }}>
            <Field label="Pemilik awal/terakhir" required error={errors.pemilikSaatIni}>
              <input className={"input" + (errors.pemilikSaatIni ? " error" : "")} placeholder="Nama lengkap pemilik" value={form.pemilikSaatIni} onChange={(e) => change("pemilikSaatIni", e.target.value)}/>
            </Field>
            <Field label="Status persil">
              <select className="select" value={form.status} onChange={(e) => change("status", e.target.value)}>
                <option value="terarsip">Terarsip</option>
                <option value="draft">Draft</option>
                <option value="sengketa">Sengketa</option>
              </select>
            </Field>
          </div>
        </div>

        <div>
          <div style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 10 }}>Batas tanah</div>
          <div className="grid-2">
            <Field label="Batas utara"><input className="input" placeholder="Tanah / Jalan / Saluran" value={form.batas.utara} onChange={(e) => changeBatas("utara", e.target.value)}/></Field>
            <Field label="Batas selatan"><input className="input" placeholder="Tanah / Jalan / Saluran" value={form.batas.selatan} onChange={(e) => changeBatas("selatan", e.target.value)}/></Field>
            <Field label="Batas timur"><input className="input" placeholder="Tanah / Jalan / Saluran" value={form.batas.timur} onChange={(e) => changeBatas("timur", e.target.value)}/></Field>
            <Field label="Batas barat"><input className="input" placeholder="Tanah / Jalan / Saluran" value={form.batas.barat} onChange={(e) => changeBatas("barat", e.target.value)}/></Field>
          </div>
        </div>
      </div>
    </Modal>
  );
}

// ---------------------------------- DETAIL RIWAYAT ----------------------------------
function DetailRiwayat({ state, parcelId, go }) {
  const p = state.parcels.find((x) => x.id === parcelId);
  const toast = useToast();
  const [previewDoc, setPreviewDoc] = useState(null);

  if (!p) {
    return (
      <div className="card card-pad" data-screen-label="Detail Riwayat">
        <div style={{ textAlign: "center", padding: "40px 0", color: "var(--ink-3)" }}>
          <Icon name="alert" size={32}/>
          <div style={{ fontWeight: 600, color: "var(--ink-1)", marginTop: 8 }}>Persil tidak ditemukan</div>
          <Btn variant="primary" icon="chevron-left" style={{ marginTop: 14 }} onClick={() => go("data-tanah")}>Kembali ke Data Tanah</Btn>
        </div>
      </div>
    );
  }

  const archives = state.archives
    .filter((a) => a.parcelId === p.id)
    .sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

  const openDoc = (a, doc) => {
    setPreviewDoc({ archive: a, doc });
    // append audit VIEW_FILE
    setTimeout(() => {
      // We'll have parent setState for audit; pass via global onAuditView
      window.SIADP._onView && window.SIADP._onView(a.id + "/" + doc);
    }, 0);
    toast.info("Membuka pratinjau dokumen", doc + " — audit VIEW_FILE tercatat");
  };

  return (
    <div data-screen-label="Detail Riwayat">
      {/* Hero */}
      <div className="card card-pad" style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 24, alignItems: "stretch" }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <Btn size="sm" variant="ghost" icon="chevron-left" onClick={() => go("data-tanah")}>Kembali</Btn>
            <span style={{ color: "var(--ink-4)" }}>·</span>
            <span className="mono" style={{ color: "var(--ink-3)", fontSize: 12.5 }}>{p.kode}</span>
          </div>
          <h2 style={{ margin: 0, fontSize: 22, letterSpacing: "-0.01em" }}>{p.alamat}</h2>
          <div style={{ color: "var(--ink-3)", marginTop: 4, fontSize: 13.5 }}>RT {p.rt} / RW {p.rw} · Kelurahan Loktuan</div>

          <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
            <StatusBadge status={p.status}/>
            <Badge variant="muted">NOP <span className="mono" style={{ marginLeft: 4 }}>{p.nop}</span></Badge>
            <Badge variant="muted">Luas {p.luas} m²</Badge>
            <Badge variant="primary"><Icon name="user" size={12} stroke={2}/> {p.pemilikSaatIni}</Badge>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
            <Btn variant="primary" icon="plus" onClick={() => go("arsip-baru", p.id)}>Tambah Peralihan</Btn>
            <Btn variant="ghost" icon="edit" onClick={() => toast.info("Mode edit", "Form edit persil belum diaktifkan di prototype.")}>Edit Persil</Btn>
          </div>
        </div>

        <div className="map-preview">
          <div className="label">Sketsa bidang · {p.kode}</div>
          <svg viewBox="0 0 320 180" className="parcel" preserveAspectRatio="none">
            <polygon
              points="60,40 250,30 270,140 80,150"
              fill="oklch(96% 0.04 195 / 0.85)"
              stroke="oklch(42% 0.07 195)"
              strokeWidth="2"
              strokeDasharray="4 3"
            />
            <text x="160" y="95" textAnchor="middle" fontFamily="JetBrains Mono" fontSize="11" fill="oklch(35% 0.06 195)">{p.luas} m²</text>
            <text x="160" y="20" textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="oklch(40% 0.05 195)">U: {p.batas.utara}</text>
            <text x="160" y="170" textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill="oklch(40% 0.05 195)">S: {p.batas.selatan}</text>
            <text x="10" y="95" textAnchor="start" fontFamily="JetBrains Mono" fontSize="9" fill="oklch(40% 0.05 195)">B</text>
            <text x="310" y="95" textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="oklch(40% 0.05 195)">T</text>
          </svg>
        </div>
      </div>

      {/* Body grid */}
      <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 16, marginTop: 16 }}>

          <div className="card-head">

            </div>
            <Badge variant="muted">{archives.length} peralihan</Badge>
          </div>
          <div className="card-pad">
            {archives.length === 0 ? (
              <div style={{ padding: 30, textAlign: "center", color: "var(--ink-3)" }}>
                <Icon name="info" size={24}/>
                <div style={{ fontWeight: 600, color: "var(--ink-1)", marginTop: 6 }}>Persil baru</div>
                <div style={{ marginTop: 4 }}>Belum ada arsip SPPHT. Tambahkan peralihan pertama untuk membangun rantai kepemilikan.</div>
              </div>
            ) : (
              <div className="timeline">
                {archives.map((a, i) => (
                  <div key={a.id} className={"tl-item " + (i === 0 ? "first" : "")}>
                    <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
